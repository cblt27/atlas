* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
header { position:sticky; top:0; z-index:5; background:var(--head); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:10px; }
header h1 { font-size:19px; margin:0; flex:1; font-weight:650; }
header .sub { font-size:12px; opacity:.8; }
header button { background:rgba(255,255,255,.15); border:0; color:#fff; border-radius:10px; padding:7px 10px; font-size:14px; }
main { padding:12px 12px calc(env(safe-area-inset-bottom) + 84px); max-width:720px; margin:0 auto; }
nav { position:fixed; bottom:0; left:0; right:0; background:var(--nav); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:6; }
nav button { flex:1; border:0; background:none; padding:9px 0 8px; font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; }
nav button svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
nav button.on { color:var(--primary); font-weight:650; }
.card { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 2px var(--shadow); }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; min-width:0; }
.muted { color:var(--muted); font-size:13px; }
.big { font-size:26px; font-weight:700; }
.chip { display:inline-block; font-size:12px; padding:3px 8px; border-radius:999px; background:var(--soft); color:var(--ink); white-space:nowrap; border:0; }
.chip.in { background:var(--in-t); color:var(--in); } .chip.out { background:var(--out-t); color:var(--out); } .chip.late { background:var(--amber-t); color:var(--amber); } .chip.teal { background:var(--teal-t); color:var(--teal); }
.chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch; }
.chips button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 12px; font-size:14px; white-space:nowrap; color:var(--ink); }
.chips button.on { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
.cal { background:var(--card); border-radius:14px; padding:10px 6px 8px; margin-bottom:10px; box-shadow:0 1px 2px var(--shadow); }
.calhead { display:flex; align-items:center; gap:6px; padding:0 4px 8px; }
.calhead b { font-size:17px; text-transform:capitalize; flex:1; text-align:center; }
.calhead button { border:0; background:var(--soft); border-radius:10px; min-width:38px; height:34px; font-size:18px; color:var(--ink); padding:0 8px; }
.calhead button.txt { font-size:13px; }
.calhead button:disabled { opacity:.35; }
.grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; }
.dow { text-align:center; font-size:11px; color:var(--muted); padding-bottom:4px; }
.day { min-height:54px; border-radius:10px; padding:4px 1px 3px; text-align:center; font-size:14px; position:relative; background:var(--cell); border:0; color:var(--ink); min-width:0; overflow:hidden; font-family:inherit; }
.day.other { opacity:.35; }
.day.today .n { background:var(--primary); color:var(--on-primary); border-radius:999px; padding:1px 6px; }
.day.sel { outline:2px solid var(--primary); outline-offset:-2px; }
.day .marks { display:flex; flex-direction:column; gap:2px; margin-top:3px; align-items:center; }
.day .m { font-size:10.5px; font-weight:650; border-radius:6px; padding:0 3px; line-height:15px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:clip; letter-spacing:-.2px; }
.day .m.in { background:var(--in-t); color:var(--in); } .day .m.out { background:var(--out-t); color:var(--out); } .day .m.dir { background:var(--teal-t); color:var(--teal); }
.day .m.late { box-shadow:inset 0 0 0 1px var(--amber); }
.wband { grid-column:1 / -1; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); background:var(--soft); border-radius:8px; padding:4px 8px; margin:0 0 5px; border:0; text-align:left; font-family:inherit; min-height:26px; }
.wband b { color:var(--ink); font-weight:650; }
.wband .grow { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.neg, .wband .neg { color:var(--out); } .pos { color:var(--in); } .warn { color:var(--amber); }
.op { display:flex; gap:10px; align-items:stretch; }
.op .bar { width:4px; border-radius:4px; background:var(--muted); flex:none; }
.op.in .bar { background:var(--in); } .op.out .bar { background:var(--out); } .op.dir .bar { background:var(--teal); }
.op .q { font-weight:700; font-size:17px; white-space:nowrap; }
h2 { font-size:13px; margin:16px 4px 8px; color:var(--muted); font-weight:650; text-transform:uppercase; letter-spacing:.03em; }
table { width:100%; border-collapse:collapse; font-size:14px; }
td,th { padding:7px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
td:first-child,th:first-child { text-align:left; }
th { font-size:12px; color:var(--muted); font-weight:600; }
.scroll { overflow-x:auto; }
.kv { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); font-size:14px; }
.kv:last-child { border-bottom:0; }
.kv span:first-child { color:var(--muted); }
.kv span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
.metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 12px; margin-top:6px; }
.metrics div { min-width:0; } .metrics small { display:block; color:var(--muted); font-size:12px; } .metrics b { font-size:16px; font-variant-numeric:tabular-nums; }
.who { display:flex; gap:8px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
.who:last-child { border-bottom:0; }
.who .a { width:16px; flex:none; font-weight:700; } .who .a.in { color:var(--in); } .who .a.out { color:var(--out); } .who .a.dir { color:var(--teal); }
.who .v { font-weight:650; white-space:nowrap; font-variant-numeric:tabular-nums; }
.wk { cursor:pointer; }
.wk .t { font-weight:650; }
.curve { width:100%; height:130px; display:block; }
.sheet-bg { position:fixed; inset:0; background:var(--back); z-index:20; display:flex; align-items:flex-end; }
.sheet { background:var(--card); width:100%; max-width:720px; margin:0 auto; border-radius:18px 18px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:92vh; overflow:auto; -webkit-overflow-scrolling:touch; }
.sheet h3 { margin:0 0 4px; font-size:19px; }
label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
input,textarea { width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--cell); color:var(--ink); font-family:inherit; }
.seg { display:flex; background:var(--soft); border-radius:12px; padding:3px; }
.seg button { flex:1; border:0; background:none; padding:10px 0; border-radius:10px; font-size:15px; color:var(--ink); font-family:inherit; }
.seg button.on { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.18); font-weight:650; }
.seg.small button { padding:7px 0; font-size:14px; }
.btn { width:100%; border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:650; background:var(--primary); color:var(--on-primary); margin-top:18px; font-family:inherit; }
.btn:disabled { opacity:.5; }
.btn.light { background:var(--soft); color:var(--ink); margin-top:8px; }
.btns { display:flex; gap:8px; } .btns .btn { margin-top:8px; font-size:15px; padding:13px 8px; }
.center { text-align:center; padding:40px 20px; }
.pending { font-size:12px; color:var(--amber); }
.refused { font-size:12px; color:var(--out); }
.note { font-size:12px; color:var(--amber); margin-top:2px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 90px); background:#1c2430; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:30; max-width:90vw; box-shadow:0 2px 10px rgba(0,0,0,.3); }
.bars .b { height:10px; border-radius:6px; background:var(--primary); }
.ph { font-size:12px; color:var(--teal); }
</style>
</head>

// mémoire des photos à envoyer : la photo réduite (JPEG en base 64) est gardée dans la mémoire du téléphone, dans l'espace du compte, à côté de
// la boîte d'envoi (clé « u.<compte>.photo.<nom du fichier de la modification> ») ; retirée après l'envoi ou l'abandon ; mémoire pleine : dit,
// rien n'est gardé (quelques dizaines de photos réduites tiennent)
const PHOTO_MAX = 40 * 1024 * 1024, PHOTO_COTE = 1600;
const octets = b => b.arrayBuffer ? b.arrayBuffer() : new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsArrayBuffer(b); });

const photoMem = { cle: name => kU(moi(), "photo." + name), get: cle => ls.get(cle, null), put: (cle, b64) => ls.set(cle, b64) && ls.get(cle, null) === b64, del: cle => ls.del(cle) };
// réduction sur le téléphone : côté long 1 600 px au plus, JPEG (données de localisation retirées : nouvelle image) ; refus : pas une image, trop grosse
async function reduire(file) {
  const err = (cle, arg) => Object.assign(new Error(cle), { cle, arg });
  if (!file || !(/^image\//.test(file.type || "") || (!file.type && /\.(jpe?g|png|heic|heif|gif|webp)$/i.test(file.name || "")))) throw err("notImage");
  if (file.size > PHOTO_MAX) throw err("tooBig", nf(file.size / 1048576, 1));
  const url = URL.createObjectURL(file);

    const img = new Image();
    await new Promise((ok, ko) => { img.onload = ok; img.onerror = () => ko(err("notImage")); img.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight; if (!w0 || !h0) throw err("notImage");
    const k = Math.min(1, PHOTO_COTE / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85)); if (!blob) throw err("photoErr");
    return { blob, l: w, h };
  } finally { URL.revokeObjectURL(url); }
}

// dans « photos », puis la modification qui la cite, dans « modifs ») ; hors réseau : envoyée au retour du réseau, comme les autres saisies
async function ajouterPhoto(ref, file) {
  if (ligneBloquee(ref)) return false;
  if (!data || (!DEMO && (!place || !account || !moi()))) { toast("⚠ " + t("noSheet")); return false; }
  if (!(data.livraisons || []).some(x => x.ref === ref)) { toast("⚠ " + t("noDeliv")); return false; }

  let r; try { r = await reduire(file); } catch (e) { toast("⚠ " + (e && e.cle ? tf(e.cle, e.arg || "") : t("photoErr"))); return false; }
  if (DEMO) { toast(t("demoSent")); return true; }

// abandon confirmé (deux touches) : l'entrée sort de la boîte et son attente est retirée, dans SON dossier (amendement a) ; refusé si elle n'est
// plus bloquée (envoi lancé par Réessayer en cours : son PUT est peut-être parti) ; les entrées SUIVANTES du même dossier portant une livraison
// sur une réf dont elle change le statut, la date, la quantité ou le transporteur ont vu l'état qu'elle donne (Atlas refuserait leur reprise) :
// elles sont listées et leur abandon proposé (deux touches) ; jamais abandonnées d'office, leur état vu jamais réécrit
function abandonner(name) {

  if (!bloquees(box).has(name)) { toast(t("dropBusy")); render(); return; }

const VU = ["statut", "date", "qte", "transporteur"];

// a changé depuis l'état vu : Mobile.cs, SeenDiff ; seuls les autres champs sont refusés)
function suivantes(box, e) {
  const refs = new Set(((e.body && e.body.changements) || []).filter(c => c.t === "livraison" && VU.includes(c.champ)).map(c => c.ref));
  if (!refs.size) return [];
  return box.slice(box.indexOf(e) + 1).filter(x => dosId(x) === dosId(e) && ((x.body && x.body.changements) || []).some(c => c.t === "livraison" && refs.has(c.ref) && c.champ !== "commentaire"));
}
// entrées toujours bloquées au moment de la décision (un envoi a pu partir entre-temps) : sinon rien n'est retiré
const toujoursBloquees = noms => { const bq = bloquees(us.get("outbox", [])); return noms.every(n => bq.has(n)); };
function retirer(noms) {

function proposerSuivantes(e, deps) {

// Se déconnecter (point 4) : tout est masqué AVANT la redirection (un retour arrière ne montre rien) ; la fiche de ce compte est effacée du

function deconnecter() {

  document.querySelectorAll(".sheet-bg, .toast").forEach(x => x.remove());

function sheet(html, onReady) {

// envoi depuis une feuille : bouton bloqué pendant l'envoi ; une fois la modification gardée dans la boîte d'envoi (renvoyée sous le même nom :
// jamais un second fichier pour la même saisie), la feuille se ferme, partie ou non ; pas gardée (mémoire du téléphone, fiche retirée…) : la

async function submit(bg, close, ch, name) {

  catch (e) { if (!etat.gardee) { ok.disabled = false; toast("⚠ " + (e && e.message)); return; } }   // rien de gardé : la feuille reste ouverte

// ligne (ou lot) qui a une entrée bloquée, ou une entrée en attente derrière une bloquée du même dossier : pas de nouvelle saisie (son état « vu »

          '<label>' + t("date") + '</label><input id="d" type="date" value="' + esc(l.date || "") + '"><label>' + t("qty") + '</label><input id="q" type="number" inputmode="decimal" value="' + esc(l.qte) + '">') +
    '<label>' + t("carrier") + '</label><input id="c" value="' + esc(l.transporteur || "") + '"><label>' + t("comment") + '</label><textarea id="m" rows="2"></textarea>' +
    // round 23 : photos de la livraison (appareil photo ou galerie), envoyées chacune à part, même sur une livraison confirmée ou facturée

const phLigne = l => "📷 " + tf("photoN", l.photos || 0) + (l.photosAttente ? " · " + tf("photoWait", l.photosAttente) : "");

// round 23 : mise à jour automatique de la fiche (« que ça se mette à jour côté app ») : au retour au premier plan après 1 min, et toutes les
// 2 min tant que l'app est ouverte ; jamais pendant une saisie (feuille ouverte, champ actif) ni sur Réglages ; une coupure réseau est muette (la

const authMsg = a => a ? t("authErr").replace("{0}", (a.errorMessage || a.message || String(a)).split("\n")[0]) : "";

// erreur au démarrage (boot) ou sur ↻
function echec(e, auBoot) {
