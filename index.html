.vtile small { display:block; font-size:12.5px; color:var(--muted); font-weight:650; }
.vpl { display:flex; align-items:center; gap:10px; margin:2px 0 8px; flex-wrap:wrap; }
.vpl b { font-size:28px; line-height:1.15; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.4px; white-space:nowrap; }
.vst { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--soft); }
.vst.big { height:16px; border-radius:8px; }
.vst i { display:block; height:100%; flex:none; } .vst .mv.l { background:var(--v-long); } .vst .mv.s { background:var(--v-short); }
.vst .lk, .vsw.lk { background:repeating-linear-gradient(135deg, var(--v-swap) 0 3px, rgba(var(--v-swap-rgb), .30) 3px 6px); }
.vstl { display:flex; justify-content:space-between; gap:8px; font-size:12.5px; font-weight:700; margin-top:5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.vstl .z { color:var(--muted); } .v-lock { color:var(--v-swap-t); }
.vbarw { font-size:13px; font-weight:400; letter-spacing:0; margin-top:8px; }
.vtag { display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.04em; padding:2px 7px; border-radius:6px; background:var(--soft); color:var(--muted); white-space:nowrap; vertical-align:middle; }
.vtag.long { background:rgba(var(--v-long-rgb), .14); color:var(--v-long-t); } .vtag.short { background:rgba(var(--v-short-rgb), .14); color:var(--v-short-t); }
.v-long { color:var(--v-long); } .v-short { color:var(--v-short); } .v-swap { color:var(--v-swap); } .v-nv { color:var(--muted); }
.vo { padding:12px 12px 12px; }
.vo, .vtile { scroll-margin-top:calc(env(safe-area-inset-top) + 70px); }   /* outil amené à l'écran : jamais sous l'en-tête fixe */
@keyframes vflash { 0% { box-shadow:0 0 0 3px var(--primary); } 100% { box-shadow:0 1px 2px var(--shadow); } }
.vo h3 { display:flex; align-items:center; gap:8px; margin:0 0 8px; font-size:15.5px; font-weight:750; }
.vo h3 > span { flex:1; min-width:0; } .vo h3 em { font-style:normal; font-size:12.5px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; background:var(--soft); border-radius:999px; padding:2px 8px; }
.vi { flex:none; width:26px; height:26px; border-radius:50%; border:0; background:var(--soft); color:var(--muted); font-size:14px; font-weight:800; font-family:Georgia,serif; font-style:italic; padding:0; line-height:26px; }
.vi.on { background:var(--primary); color:var(--on-primary); }
.vtip { font-size:13px; line-height:1.4; background:var(--soft); border-radius:10px; padding:8px 10px; margin:-2px 0 10px; }
.vleg { display:flex; flex-wrap:wrap; gap:5px 12px; font-size:12px; color:var(--muted); margin-top:8px; }
.vleg span { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.vsw { flex:none; width:10px; height:10px; border-radius:3px; display:inline-block; background:var(--muted); }
.vsw.long { background:var(--v-long); } .vsw.short { background:var(--v-short); } .vsw.swap { background:var(--v-swap); } .vsw.nc { background:var(--v-nc); }
.vsw.nv { background:repeating-linear-gradient(135deg, var(--v-nv) 0 2px, transparent 2px 4px); box-shadow:inset 0 0 0 1px var(--v-nv); }
.vsw.fixe { background:var(--v-fixe); } .vsw.idx { background:var(--v-idx); } .vsw.ink { background:var(--ink); height:3px; border-radius:2px; }
.vramp { display:inline-flex; border-radius:3px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--line); } .vramp i { width:8px; height:11px; display:block; }
.vempty { color:var(--muted); font-size:13.5px; padding:6px 0; }
/* C · ce qui cloche : 2-3 mots + icône, aucun chiffre */
.val { display:flex; flex-wrap:wrap; gap:6px; }
.val button, .val .ok { display:inline-flex; align-items:center; gap:6px; border:0; border-radius:999px; padding:7px 12px 7px 10px; font-size:13.5px; font-weight:700; font-family:inherit; background:var(--soft); color:var(--ink); white-space:nowrap; }
.val i { font-style:normal; font-size:13px; }
.val .short { background:rgba(var(--v-short-rgb), .14); color:var(--v-short-t); }
.val .nc { background:var(--amber-t); color:var(--v-nc-t); } .val .nv { background:var(--soft); color:var(--ink); } .val .ok { color:var(--v-long-t); }
/* E · carte de chaleur : produits en lignes, mois en colonnes (défilement) ; case = position nette du mois + barre bouge / ▣ */
.vmapw { margin:0 -4px; }
.vmap { display:grid; gap:4px; align-items:stretch; --vm0:92px; --vmc:68px; padding:0 4px 2px; width:max-content; min-width:100%; }
.vmap .vm0, .vmap .vh { position:sticky; left:0; z-index:2; background:var(--card); box-shadow:-6px 0 0 var(--card), 4px 0 0 var(--card); }
.vmap .vh { font-size:12.5px; font-weight:750; text-align:left; padding:0; border:0; color:var(--ink); font-family:inherit; min-width:0; display:flex; align-items:stretch; }
.vmap .vh span { flex:1; display:flex; align-items:center; padding:0 6px; border-radius:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.vmap .vh.on span { background:var(--primary); color:var(--on-primary); }
.vmap .vmh { font-size:12px; font-weight:650; color:var(--muted); border:0; background:none; padding:4px 0; font-family:inherit; white-space:nowrap; border-radius:8px; }
.vmap .vmh.on { color:var(--ink); font-weight:800; background:var(--soft); }
.vc { border:0; border-radius:7px; height:42px; padding:5px 5px 6px; font-family:inherit; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:5px; background:var(--cell); color:var(--muted); overflow:hidden; cursor:pointer; }
.vc b { display:block; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; text-align:center; white-space:nowrap; line-height:1.25; }
.vc .vst { height:5px; border-radius:3px; background:var(--card); flex:none; box-shadow:0 0 0 1.5px var(--card); margin:0 1px; }
.vc.vk .vst .mv { background:currentColor; }   /* barre « bouge » d'une case : couleur du chiffre (noir ou blanc, contraste choisi par palier) : jamais vert sur vert */
.vc.eq b, .vc.nul b { font-weight:650; }
.vc.nul { background:repeating-linear-gradient(135deg, var(--soft) 0 4px, transparent 4px 8px); }
.vc.sel { box-shadow:inset 0 0 0 2px var(--ink); }
/* round 33 : rangées d'information sous le produit choisi (jamais une couleur de sens) : stock physique déjà vendu ; indexé vendu fixe (bleu couvert, orange non couvert) */
.vmap .vh.vhs span { font-size:11px; font-weight:650; color:var(--muted); flex-direction:column; align-items:flex-start; justify-content:center; line-height:1.15; white-space:nowrap; padding-left:10px; }
.vmap .vh.vhs small { font-size:11px; font-weight:500; }
.vc.vsub { height:34px; background:var(--soft); color:var(--muted); gap:3px; }
.vc.vsub.vend { background:rgba(var(--v-swap-rgb), .10); color:var(--ink); }
.vc.vsub b { font-size:12px; font-weight:700; }
.vc .vib { display:flex; height:4px; border-radius:2px; overflow:hidden; margin:0 2px; background:var(--card); }
.vc .vib .c { background:var(--v-swap); } .vc .vib .n { background:var(--v-nc); }
.vsw.vend { background:rgba(var(--v-swap-rgb), .22); } .vsw.cv { background:var(--v-swap); } .vsw.ncv { background:var(--v-nc); }
.vk.l.k1 { background:rgba(var(--v-long-rgb), var(--va1)); color:var(--vt1); } .vk.l.k2 { background:rgba(var(--v-long-rgb), var(--va2)); color:var(--vt2); }
.vk.l.k3 { background:rgba(var(--v-long-rgb), var(--va3)); color:var(--vt3); } .vk.l.k4 { background:rgba(var(--v-long-rgb), var(--va4)); color:var(--vt4); }
.vk.l.k5 { background:rgba(var(--v-long-rgb), var(--va5)); color:var(--vt5); }
.vk.s.k1 { background:rgba(var(--v-short-rgb), var(--va1)); color:var(--vt1); } .vk.s.k2 { background:rgba(var(--v-short-rgb), var(--va2)); color:var(--vt2); }
.vk.s.k3 { background:rgba(var(--v-short-rgb), var(--va3)); color:var(--vt3); } .vk.s.k4 { background:rgba(var(--v-short-rgb), var(--va4)); color:var(--vt4); }
.vk.s.k5 { background:rgba(var(--v-short-rgb), var(--va5)); color:var(--vt5); }
/* graphiques */
.vsvg { width:100%; height:auto; display:block; }
.vsvg text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:var(--muted); font-size:10.5px; }
.vsvg text.on { fill:var(--ink); font-weight:800; }
.vsvg .grid { stroke:var(--line); stroke-width:1; } .vsvg .zero { stroke:var(--muted); stroke-width:1; stroke-dasharray:3 3; }
.vsvg .sel { fill:var(--soft); } .vsvg .lv { stroke:var(--ink); stroke-width:1.6; } .vsvg .lvd { stroke:var(--ink); stroke-width:1.2; stroke-dasharray:3 3; }
.vsvg .in { fill:var(--v-long); } .vsvg .out { fill:var(--v-short); } .vsvg .fixe { fill:var(--v-fixe); } .vsvg .idx { fill:var(--v-idx); }
.vsvg .nvb { fill:url(#vpNv); stroke:var(--v-nv); stroke-width:.8; } .vsvg .lkb { fill:url(#vpLk); } .vsvg .swap { fill:var(--v-swap); }
.vsvg .vide { fill:none; stroke:var(--line); stroke-dasharray:3 2; } .vsvg .hit { fill:transparent; cursor:pointer; }
.vval { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px 8px; margin-top:8px; }
.vval button { border:0; background:var(--soft); border-radius:10px; padding:6px 9px; text-align:left; font-family:inherit; color:var(--ink); min-width:0; }
.vval small { display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); white-space:nowrap; }
.vval b { display:block; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vval.v3 { grid-template-columns:repeat(3, minmax(0, 1fr)); }
.vbadge { float:right; font-size:11.5px; font-weight:700; color:var(--v-nc-t); background:var(--amber-t); border-radius:999px; padding:2px 8px; }
/* C · jauges de couverture : arc bleu = tous les swaps, orange = non couvert, chiffre = l'arc */
.vgs { display:flex; flex-wrap:wrap; gap:8px 6px; justify-content:center; }
.vg { flex:1 1 140px; max-width:180px; border:0; background:none; text-align:center; font-family:inherit; color:var(--ink); padding:0; cursor:pointer; }
.vg svg { width:100%; height:auto; display:block; }
.vg .arc0 { stroke:var(--soft); } .vg .arc-sw { stroke:var(--v-swap); } .vg .arc-nc { stroke:var(--v-nc); }
.vg .vgp { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; fill:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
.vg b { display:block; font-size:13.5px; margin-top:-2px; } .vg small { display:block; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.vg.on b { color:var(--primary); }
/* B · curseur : même barre que la case de la carte, gain ▲ / perte ▼ */
.vsbig { display:block; width:100%; border:0; background:none; font-family:inherit; font-size:30px; line-height:1.15; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:-.4px; padding:10px 0 4px; color:var(--ink); }
.vsbig.z { color:var(--muted); }
.vrange { width:100%; margin:0; accent-color:var(--primary); height:30px; }
.vsrow { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.vsrow b { font-size:15px; color:var(--ink); }
/* G · contreparties */
.vcph { display:grid; grid-template-columns:1fr 1fr; font-size:12px; font-weight:750; margin-bottom:2px; }
.vcph span:first-child { color:var(--v-long-t); text-align:right; padding-right:8px; } .vcph span:last-child { color:var(--v-short-t); padding-left:8px; }
.vcp { display:block; width:100%; border:0; background:none; font-family:inherit; color:var(--ink); padding:4px 0 6px; text-align:left; cursor:pointer; border-bottom:1px solid var(--line); }
.vcp:last-child { border-bottom:0; }
.vcp > b { display:block; font-size:12.5px; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; }
.vcpb { display:grid; grid-template-columns:1fr 2px 1fr; align-items:center; }
.vcpb > span { display:flex; align-items:center; gap:5px; min-width:0; height:16px; font-size:11.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.vcpb > span:first-child { justify-content:flex-end; } .vcpb > i { height:22px; background:var(--muted); }
.vcpb em { display:block; height:14px; border-radius:3px; flex:none; font-style:normal; } .vcpb em.in { background:var(--v-long); border-radius:3px 0 0 3px; } .vcpb em.out { background:var(--v-short); border-radius:0 3px 3px 0; }
/* F · prix face au repère marché : une rangée par prix, crochet jusqu'au repère, écart ▲ / ▼ sur son crochet */
.vsvg .mkl { stroke:var(--ink); stroke-width:1.5; stroke-dasharray:4 3; }
.vsvg .mkc { fill:var(--card); stroke:var(--ink); stroke-width:1.2; stroke-dasharray:3 2; }
.vsvg .mkt { fill:var(--ink); font-size:11.5px; font-weight:700; }
.vsvg .nm { font-size:12px; font-weight:750; }
.vsvg .gap { fill:var(--ink); font-size:12.5px; font-weight:800; } .vsvg .pv { fill:var(--ink); font-size:12px; font-weight:700; }
.vnomk { background:var(--soft); color:var(--muted); border-radius:12px; padding:20px 10px; text-align:center; font-size:14px; font-weight:650; }
/* tableaux (un toucher sur un chiffre) */
.vbig { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; margin:2px 0 10px; }
.vtabw { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; }
/* correctifs mobqa (08/10) : largeurs AUTOMATIQUES (plus de table-layout fixe) : un nombre garde toujours sa largeur entière (jamais « … » ni coupé net),
   les textes (contrat, contrepartie, référence) passent à la ligne au lieu d'être coupés par « … » ; de 320 à 430 px */
.vtab { width:100%; border-collapse:collapse; font-size:13px; table-layout:auto; }
.vtab th, .vtab td { padding:7px 4px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.vtab th { font-size:11.5px; color:var(--muted); font-weight:650; }
.vtab td.l { white-space:normal; overflow-wrap:anywhere; line-height:1.3; }
.vtab .l { text-align:left; } .vtab .c { text-align:center; } .vtab .w0 { width:52px; } .vtab .w3 { width:46px; }
.vtab tr.tot td { font-weight:800; border-top:2px solid var(--line); border-bottom:0; }
.vdot { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:0; } .vdot.idx { background:var(--v-idx); } .vdot.nv { background:var(--v-nv); } .vdot.swap { background:var(--v-swap); }
.vdot.ok { background:var(--v-long); } .vdot.prev { background:none; box-shadow:inset 0 0 0 1.5px var(--muted); }
.xold td:first-child, .xold th:first-child { position:sticky; left:0; background:var(--card); z-index:1; }
/* round 27 (piste mob, 07/10 22 h) : plage de mois (raccourcis + « de … à … »), tuile « Position fin de plage » (stock du jour, camions sans client),
   cadre de la plage sur la carte, « Destination des livraisons » (camion d'achat vert, ➜ direct sarcelle, entrepôt, vide en pointillés gris, vente sans
   camion en pointillés rouges), couverture par contrat (bleu à venir, orange non couvert, contour bleu en trop, ▣ hachuré fixé). Deux thèmes. */
.vplage { background:var(--card); border-radius:14px; padding:8px 10px 9px; box-shadow:0 1px 2px var(--shadow); margin:0 0 10px; }
.vrs button { font-size:13.5px; padding:7px 0; white-space:nowrap; }
.vprow { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }   /* écran étroit : lb | MT passe à la ligne, l'année des listes reste entière */
.vpsel { display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); font-weight:650; min-width:0; flex:1 1 104px; }
.vpsel select { flex:1; min-width:0; width:100%; font:inherit; font-size:14px; font-weight:750; color:var(--ink); background:var(--soft); border:0; border-radius:9px; padding:6px 4px; }
.vprow .xu { width:88px; }
.vtile .vtmini { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.35fr); gap:6px; margin-top:10px; }
.vtmini button { border:0; background:var(--soft); border-radius:10px; padding:6px 9px; text-align:left; font-family:inherit; color:var(--ink); min-width:0; cursor:pointer; }
.vtmini small { display:block; font-size:11.5px; color:var(--muted); font-weight:650; white-space:nowrap; }
.vtmini b { display:flex; align-items:center; gap:5px; font-size:14.5px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; }
.vki { width:20px; height:12px; flex:none; vertical-align:-1px; }
.vki .bx { fill:var(--v-long); } .vki .cb, .vki .wh { fill:var(--ink); } .vki .vd { fill:none; stroke:var(--v-nv); stroke-width:1.5; stroke-dasharray:3 2; }
.vki .att { fill:none; stroke:var(--v-short); stroke-width:1.3; stroke-dasharray:2.4 1.6; } .vki .wha { fill:var(--v-short); }
.val .vide { background:var(--card); box-shadow:inset 0 0 0 1.5px var(--v-nv); color:var(--ink); }
.val .vsk { background:var(--card); box-shadow:inset 0 0 0 1.5px var(--v-short); color:var(--v-short-t); }
.val .sw { background:rgba(var(--v-swap-rgb), .14); color:var(--v-swap-t); }
.val i svg { display:block; }
.vmap .vfr { border:2.5px solid var(--ink); border-radius:9px; margin:0 -3px -3px 0; pointer-events:none; z-index:1; }
.vmap .vmh.rg { color:var(--ink); font-weight:800; }
.vmap .vmh.sd { font-size:11.5px; text-align:center; align-self:center; }
.vsvg .sel.rg { fill:var(--soft); }
.vsw.tr { background:none; box-shadow:inset 0 0 0 2px var(--v-swap); }
.vcvs { display:block; }
.vcv { display:block; width:100%; border:0; background:none; font-family:inherit; color:var(--ink); padding:6px 0 8px; text-align:left; cursor:pointer; border-bottom:1px solid var(--line); }
.vcv:last-child { border-bottom:0; }
.vcvh { display:flex; align-items:baseline; gap:8px; } .vcvh b { flex:1; min-width:0; font-size:13px; font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vcvh em { font-style:normal; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.vcvb { display:flex; height:14px; margin:5px 0 5px; border-radius:4px; background:var(--soft); }
.vcvb i { display:block; height:100%; flex:none; } .vcvb .sw { background:var(--v-swap); } .vcvb .nc { background:var(--v-nc); } .vcvb .tr { box-shadow:inset 0 0 0 2px var(--v-swap); }
.vcvb i:first-child { border-radius:4px 0 0 4px; } .vcvb i:last-child { border-radius:0 4px 4px 0; } .vcvb i:only-child { border-radius:4px; }
.vcvl { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.vlk { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:750; color:var(--v-swap-t); border-radius:999px; padding:2px 8px; background:repeating-linear-gradient(135deg, rgba(var(--v-swap-rgb), .24) 0 3px, rgba(var(--v-swap-rgb), .08) 3px 6px); }
.vkm { border-top:1px solid var(--line); padding:9px 0 4px; }
.vkm:first-of-type { border-top:0; padding-top:0; }
.vkmh { display:flex; flex-wrap:wrap; align-items:center; gap:4px 5px; margin-bottom:5px; }
.vkmh > b { font-size:14px; font-weight:800; margin-right:3px; }
.vkc { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:750; border-radius:999px; padding:2px 7px; white-space:nowrap; font-variant-numeric:tabular-nums; background:var(--soft); color:var(--ink); }
.vkc.dir { background:var(--teal-t); color:var(--teal); } .vkc.vid { background:none; box-shadow:inset 0 0 0 1.3px var(--v-nv); color:var(--ink); }
.vkc.att { background:none; box-shadow:inset 0 0 0 1.3px var(--v-short); color:var(--v-short-t); } .vkc.nul { background:none; color:var(--muted); font-weight:650; }
.vksvg text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

/* ================= Mobile v124 · style Bloomberg (thème Bloomberg d'Atlas : Theme41, Theme47, Chrome48) =================
   Fond noir ; libellés et titres en ambre, données en blanc, chiffres en chasse fixe ; barre rouge des fonctions (titre de la page) ; onglets ardoise
   à texte clair, l'onglet choisi en bleu à texte blanc ; boutons gris à texte blanc, action principale bleue ; champ modifiable = pavé ambre à texte
   noir ; angles droits, aucune ombre de décor ; achat / entrée en vert, vente / sortie en rouge. Un seul thème (le réglage Apparence est retiré). */
html:root, html:root[data-theme] {
  --bg:#000; --card:#0a0a0a; --ink:#e6e6e6; --muted:#b0b0b0; --line:#2c343e; --primary:#2b7bd4; --on-primary:#fff; --head:#000; --soft:#161616;
  --cell:#0a0a0a; --nav:#000; --shadow:transparent; --in:#36c24a; --in-t:#0d2a12; --out:#ff3b4a; --out-t:#3a0d12; --amber:#f0a21e; --amber-t:#2a1c05;
  --teal:#9fe0f2; --teal-t:#0f2a30; --back:rgba(0,0,0,.74); color-scheme:dark; --fix:#5aa0ff; --fix-t:#0e1f38; --idx:#f0a21e; --idx-t:#2a1c05;
  --sw:#b79cff; --sw-t:#221a38; --stk0:#6e747c; --gl:#0d2a12; --gc:#3a0d12;
  --v-long:#36c24a; --v-short:#ff3b4a; --v-swap:#5aa0ff; --v-nc:#f0a21e; --v-fixe:#b8b8b8; --v-idx:#b79cff; --v-nv:#6e747c;
  --v-long-rgb:54,194,74; --v-short-rgb:255,59,74; --v-swap-rgb:90,160,255; --v-long-t:#6fdc7f; --v-short-t:#ff7a85; --v-nc-t:#ffc940; --v-swap-t:#9cc2ff;
  --va1:.20; --va2:.38; --va3:.56; --va4:.76; --va5:.95; --vt1:#fff; --vt2:#fff; --vt3:#fff; --vt4:#000; --vt5:#000;
  --radius:0; --bar:#8c141a; --bar-hot:#a81c23; --bar-line:#c9474d; --tab:#383b42; --tab-ink:#f2f2f2; --tab-on:#1565a8; --key:#1f5fbf;
  --btn:#2e2e2e; --btn-line:#6e6e6e; --field:#ffa018; --field-ink:#000; --dim:#8a8a8a; --white:#f5f5f5; --gut:14px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html,body { background:#000; color:var(--ink); font-family:-apple-system,"Helvetica Neue",Arial,"Segoe UI",Roboto,sans-serif; }
/* round 104 : angles droits forcés retirés (style Bloomberg) : chaque élément reprend ses arrondis (base de design 104 en fin de feuille) */
/* chiffres : chasse fixe, alignés */
.big, .q, .quantity, .v, .metrics b, .kv span:last-child, td, .position-number, .cash-row strong, .trend-row strong, .stock-now strong, .day .m,
.route-head strong, .route-destination strong, .attention-row>b, .expo-hero>strong, .vpl b, .mono, .num { font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:0; }
/* en-tête : marque ATLAS, langue, actualiser */
header { background:#000; color:var(--ink); border-bottom:1px solid var(--line); gap:8px; padding:calc(env(safe-area-inset-top) + 6px) var(--gut) 6px; min-height:52px; }
header .hl { min-width:0; }
header h1, header h1.brand { margin:0; font-size:15px; line-height:1.1; font-weight:700; letter-spacing:.14em; color:var(--amber); font-family:var(--mono); white-space:nowrap; overflow:hidden; }
header .sub { font-size:11px; color:var(--muted); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
header button { min-width:44px; min-height:40px; background:var(--btn); border:1px solid var(--btn-line); color:#fff; font-size:16px; padding:4px 8px; }
/* barre rouge des fonctions : titre de la page, sur toute la largeur */
main { padding-top:10px; }
.fbar, .reading-head { display:flex; align-items:center; gap:8px; justify-content:space-between; background:var(--bar); color:#fff; margin:-10px calc(-1 * var(--gut)) 12px;
  padding:6px var(--gut); min-height:40px; border:0; }
.fbar h2, .reading-head .page-title, .page-title { margin:0; font-size:14px !important; letter-spacing:.08em !important; text-transform:uppercase; font-weight:600; color:#fff; line-height:1.2; }
.fbar .fb-r { font:11px var(--mono); color:#fff; opacity:.92; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.reading-switch { border:0; gap:1px; }
.reading-switch button { color:#fff; min-height:36px; padding:4px 9px; font-size:12px; background:var(--bar); border:1px solid var(--bar); box-shadow:none !important; }
.reading-switch button[aria-pressed="true"] { background:var(--bar-hot); border-color:var(--bar-line); color:#fff; font-weight:600; }
/* titres de section : ambre, capitales */
.muted, .status-text, .list-count, .section-heading>span, .trend-month, .op-heading>span:not(.status-text) { color:var(--muted); }
/* panneaux : noirs, filets fins, aucune ombre */
.card, .cal, .vtile, .vplage { background:var(--card); border:1px solid var(--line); box-shadow:none; }
.sheet { background:#050505; border-top:2px solid var(--amber); }
.sheet-close { background:var(--btn) !important; color:#fff; border:1px solid var(--btn-line) !important; }
.toast { background:#161616; color:#fff; border:1px solid var(--amber); box-shadow:none; }
/* onglets, segments, puces : ardoise ; choisi : bleu, texte blanc */
.seg { background:transparent; padding:0; gap:1px; }
.seg button { background:var(--tab); color:var(--tab-ink); border:0; min-height:40px; font-size:13px; box-shadow:none !important; }
.seg button.on { background:var(--tab-on); color:#fff; font-weight:600; box-shadow:none !important; border:0; }
.chips button, .workspace-tabs button { background:var(--tab); color:var(--tab-ink); border:0; box-shadow:none !important; font-size:13px; }
.chips button.on, .workspace-tabs button.on { background:var(--tab-on); color:#fff; border:0; }
.chip { background:var(--soft); color:var(--ink); }
.chip.late { background:var(--amber-t); color:var(--amber); }
/* boutons : gris à texte blanc ; action principale bleue */
.btn { background:var(--key); color:#fff; border:1px solid var(--key); font-size:15px; font-weight:600; letter-spacing:.02em; }
.btn.light, .text-action, .calhead button, .calu { background:var(--btn); color:#fff; border:1px solid var(--btn-line); }
.text-action { min-height:40px; padding:8px 12px; font:inherit; font-size:13px; }
.majapp { background:var(--key); color:#fff; }
/* champs modifiables : pavé ambre, texte noir (lecture seule : sombre) */
input:not([type=checkbox]):not([type=radio]):not([readonly]), select, .fold select, select#uiLanguage, .unit-select, .product-select select, .vpsel select {
  background:var(--field) !important; color:var(--field-ink) !important; border:1px solid var(--field) !important; font-family:inherit; }
textarea[readonly], input[readonly] { background:var(--soft); color:var(--ink); border:1px solid var(--line); }
textarea:not([readonly]) { background:var(--soft); color:var(--ink); border:1px solid var(--field); }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
/* barre des onglets du bas : ardoise, l'onglet choisi bleu */
nav { background:#000; border-top:1px solid var(--line); gap:1px; }
nav button { background:var(--tab); color:var(--tab-ink); font-size:10.5px; letter-spacing:.02em; min-height:56px; gap:3px; box-shadow:none !important; padding:6px 0 5px; }
nav button.on { background:var(--tab-on); color:#fff; font-weight:600; box-shadow:none !important; }
/* calendrier */
.day { background:#0f0f0f; color:var(--ink); }
.day.today .n { background:var(--amber); color:#000; }
.day.sel { outline:2px solid var(--amber); }
.day .m.late { box-shadow:none; outline:1px solid var(--amber); outline-offset:-1px; }
.wband { background:#111; }
/* sens : achat / entrée vert, vente / sortie rouge */
.neg { color:var(--out); } .pos { color:var(--in); }
.cash-focus .big { color:var(--white); font-size:32px; letter-spacing:0; }
.cash-focus .big.neg { color:var(--out); }
.cash-row { background:transparent; color:var(--ink); border-bottom:1px solid var(--line); }
.version { color:var(--dim); font-family:var(--mono); }
@media (max-width:360px) { html:root, html:root[data-theme] { --gut:10px; } }

/* ---------- écran Jour ---------- */
.hm-tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; width:100%; padding:0; border:1px solid var(--line); background:var(--line); margin:0 0 12px; font:inherit; color:inherit; text-align:left; cursor:pointer; }
.hm-tile { background:var(--card); padding:8px 6px 7px; min-width:0; }
.hm-tile small { display:block; color:var(--amber); font-size:10px; letter-spacing:.04em; text-transform:uppercase; line-height:1.15; min-height:23px; overflow-wrap:anywhere; }
.hm-tile b { display:block; font:600 22px/1.1 var(--mono); color:var(--white); margin-top:3px; }
.hm-tile b.warn { color:var(--amber); } .hm-tile b.zero { color:var(--dim); }
.hm-blk { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); color:var(--ink); font:inherit; padding:10px 12px; margin:0 0 12px; cursor:pointer; }
.hm-h { display:flex; justify-content:space-between; gap:8px; align-items:baseline; color:var(--amber); font-size:11px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:4px; }
.hm-h span:last-child { color:var(--muted); letter-spacing:0; text-transform:none; font-family:var(--mono); }
.hm-big.neg { color:var(--out); }
.hm-kv { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0; border-top:1px solid #15191e; }
.hm-kv span:first-child { color:var(--muted); } .hm-kv b { font-family:var(--mono); font-weight:500; text-align:right; }
.hm-list { border:1px solid var(--line); margin:0 0 12px; }
.hm-op, .mk-row { display:grid; grid-template-columns:44px 14px minmax(0,1fr) auto; gap:6px; align-items:baseline; width:100%; min-height:44px; padding:8px 12px; border:0; border-top:1px solid #15191e;
  background:#000; color:var(--ink); font:inherit; font-size:13px; text-align:left; cursor:pointer; }
.hm-op .hm-a { font-weight:700; } .hm-op.in .hm-a { color:var(--in); } .hm-op.out .hm-a { color:var(--out); }
.hm-op .hm-w { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hm-op .hm-q { font-family:var(--mono); text-align:right; white-space:nowrap; }
.hm-more { display:block; width:100%; padding:10px 12px; border:0; border-top:1px solid #15191e; background:var(--card); color:var(--amber); font:inherit; font-size:12px; text-align:right; letter-spacing:.04em; cursor:pointer; min-height:40px; }
.hm-empty { padding:10px 12px; color:var(--muted); font-size:13px; border-top:1px solid #15191e; }

/* ---------- Marchés : moniteur et courbes ---------- */
.mk-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; margin:2px 0 6px; }
.mk-head .mk-name { flex:1 1 100%; color:var(--amber); font-size:12px; letter-spacing:.05em; text-transform:uppercase; }
.mk-head .mk-last { font:600 26px/1.1 var(--mono); color:var(--white); }
.mk-head .mk-last small { font-size:12px; color:var(--muted); font-weight:400; margin-left:4px; }
.mk-head .mk-chg { font:13px var(--mono); }
.mk-head .mk-meta { flex:1 1 100%; font:11.5px var(--mono); color:var(--muted); }
.mk-per { display:flex; gap:1px; margin:6px 0 4px; }
.mk-per button { flex:1; min-height:40px; background:var(--tab); color:var(--tab-ink); border:0; font:600 12px var(--mono); letter-spacing:.04em; }
.mk-chart { position:relative; width:100%; height:236px; background:#000; border:1px solid var(--line); touch-action:pan-y; user-select:none; -webkit-user-select:none; overflow:hidden; }
.mk-chart svg { display:block; width:100%; height:100%; }
.mk-chart .mk-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; color:var(--muted); font-size:13px; }
.mk-read { min-height:18px; font:11.5px/1.5 var(--mono); color:var(--white); margin:4px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mk-row { grid-template-columns:minmax(0,1fr) auto 62px; gap:8px; }
.mk-row .mk-n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mk-row .mk-n small { display:block; color:var(--muted); font:11px var(--mono); }
.mk-row .mk-v { font-family:var(--mono); text-align:right; white-space:nowrap; color:var(--white); }
.mk-row .mk-c { font-family:var(--mono); text-align:right; white-space:nowrap; font-size:12px; }
.mk-msg { padding:10px 12px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:13px; margin:0 0 12px; }
.mk-msg.err { color:var(--out); border-color:var(--out); }
/* mobile v131 · round 88 (CASH-EXPO) : couvert / non couvert, camions par mois de prix, trésorerie datée */
.c88sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 6px}.c88sum div{background:var(--card);border:1px solid var(--line);padding:6px 7px;min-width:0}.c88sum small{display:block;color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.c88sum b{display:block;font-family:var(--mono);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c88sum span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c88px{font-size:11px;margin-bottom:6px;overflow-wrap:anywhere}
.c88leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-bottom:6px}.c88leg i{display:inline-block;width:10px;height:8px;margin-right:4px;vertical-align:middle}.c88leg .ad{background:var(--v-nv)}.c88leg .cv{background:var(--v-swap)}.c88leg .nc{background:var(--v-nc)}.c88leg .ix{border:1.5px solid var(--v-idx)}.c88leg .sw{background:var(--v-swap-t,#9cc2ff);height:6px}
.c88head{display:grid;grid-template-columns:52px 1fr 1fr;font-size:11px;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:3px}.c88head span:last-child{text-align:right}
.c88row{display:grid;grid-template-columns:52px 1fr 1fr;align-items:end;border-bottom:1px solid var(--line);padding:5px 0 4px;column-gap:4px}.c88row.done{opacity:.62}
.c88m{grid-row:1/span 3;align-self:stretch;border:0;background:none;color:var(--white);font:600 12px var(--mono);text-align:left;padding:0}

/* round 103 (plein écran iPhone) : ouverte depuis l'écran d'accueil, l'app passe sous la barre d'état (« black-translucent ») et occupe tout
   l'écran. Les zones sûres de l'iPhone (env(safe-area-inset-*) : heure et île en haut, barre d'accueil en bas, encoche et coins arrondis sur les
   côtés en paysage) écartent tout contenu des bords : rien n'est rogné par un coin arrondi ni caché sous l'île. Le fond reste noir jusqu'au bord. */
:root { --sa-t:env(safe-area-inset-top, 0px); --sa-r:env(safe-area-inset-right, 0px); --sa-b:env(safe-area-inset-bottom, 0px); --sa-l:env(safe-area-inset-left, 0px); }
html { min-height:100%; min-height:100dvh; background:#000; overscroll-behavior-y:none; }
body { min-height:100vh; min-height:100dvh; overscroll-behavior-y:none; }
header { padding-left:calc(var(--gut) + var(--sa-l)); padding-right:calc(var(--gut) + var(--sa-r)); }
header, nav { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
/* barre des onglets : au-dessus de la barre d'accueil ; ses deux bouts restent à l'intérieur de la courbe des coins du bas */
nav { padding-left:max(6px, var(--sa-l)); padding-right:max(6px, var(--sa-r)); padding-bottom:max(var(--sa-b), 4px); }
/* feuille : jamais sous l'heure ni l'île ; hauteur de l'écran réellement visible (dvh) */
.sheet { max-height:calc(100vh - var(--sa-t) - 10px); max-height:calc(100dvh - var(--sa-t) - 10px); }
.sheet-bg ~ .toast { top:calc(var(--sa-t) + 12px); }
@media (orientation:landscape) {
  main, .exposure-screen #main { padding-left:max(28px, calc(var(--sa-l) + 12px)); padding-right:max(28px, calc(var(--sa-r) + 12px)); }
  .sheet { padding-left:max(16px, calc(var(--sa-l) + 12px)); padding-right:max(16px, calc(var(--sa-r) + 12px)); }
  nav button { min-height:46px; }
}

/* round 104 css base */
/* ================= round 104 · base de design =================
   Demande : « le texte jaune dessus fait vraiment IA cheap ». Style sobre type iOS, sur fond noir :
   · hiérarchie par la taille et le blanc, pas par la couleur : titres blancs, libellés et intitulés gris (--label), jamais jaunes ;
   · une seule couleur pour agir (bleu --primary) ; vert = entrée / achat, rouge = sortie / vente ; orange (--amber) SEULEMENT pour un avertissement ;
   · chiffres en police système à chasse tabulaire (alignés, pas de police « terminal ») ; cartes arrondies, filets fins, barres translucides ;
   · cibles de toucher de 44 px ; espacements sur une grille de 4 px. Les pistes du round 104 s'appuient sur ces jetons. */
html:root, html:root[data-theme] {
  --bg:#000; --card:#121214; --card2:#1b1b1e; --ink:#f2f2f7; --muted:#8e8e93; --label:#8e8e93; --dim:#636366; --white:#fff;
  --line:#26262b; --line2:#38383d; --soft:#1c1c1f; --cell:#121214; --nav:rgba(18,18,20,.82);
  --primary:#0a84ff; --on-primary:#fff; --key:#0a84ff; --tab-on:#0a84ff; --tab:#1c1c1f; --tab-ink:#f2f2f7;
  --in:#30d158; --in-t:rgba(48,209,88,.15); --out:#ff453a; --out-t:rgba(255,69,58,.15); --amber:#ff9f0a; --amber-t:rgba(255,159,10,.15);
  --teal:#64d2ff; --teal-t:rgba(100,210,255,.14); --gl:rgba(48,209,88,.15); --gc:rgba(255,69,58,.15);
  --btn:#1f1f23; --btn-line:#2c2c31; --field:#1c1c1f; --field-ink:#f2f2f7; --bar:transparent; --bar-hot:#2c2c31; --bar-line:#3a3a3f;
  --mono:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif; --radius:14px; --r-s:10px; --gut:16px;
  --blur:saturate(180%) blur(20px);
}
html,body { font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,"Segoe UI",Roboto,sans-serif; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
body { font-size:15px; line-height:1.4; }
::selection { background:rgba(10,132,255,.45); color:#fff; }
.big, .q, .quantity, .v, .metrics b, .kv span:last-child, td, .position-number, .cash-row strong, .trend-row strong, .stock-now strong, .day .m,
.route-head strong, .route-destination strong, .attention-row>b, .expo-hero>strong, .vpl b, .mono, .num { font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
/* en-tête : barre translucide, marque blanche, actions bleues sans cadre */
header { background:rgba(0,0,0,.72); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-bottom:.5px solid var(--line); min-height:48px; }
header h1, header h1.brand { color:#fff; letter-spacing:.02em; font-family:inherit; font-size:17px; font-weight:700; }
header .sub { font-family:inherit; color:var(--muted); font-size:12px; }
header button { background:transparent; border:0; color:var(--primary); border-radius:10px; font-size:16px; font-weight:600; }
header button:active { background:var(--soft); }
/* titre de page : grand titre blanc (plus de barre rouge pleine largeur) */
.fbar, .reading-head { background:transparent; color:var(--ink); margin:2px 0 14px; padding:0; min-height:0; align-items:flex-end; }
.fbar h2, .reading-head .page-title, .page-title { font-size:28px !important; letter-spacing:-.02em !important; text-transform:none; font-weight:700; color:#fff; line-height:1.15; }
h2.page-title, .fbar h2, .reading-head h2.page-title { color:#fff; }
.fbar .fb-r { font:12px/1.3 -apple-system,sans-serif; color:var(--muted); opacity:1; padding-bottom:4px; }
.reading-switch { background:var(--soft); border-radius:9px; padding:2px; gap:2px; }
.reading-switch button { background:transparent; border:0; color:var(--ink); border-radius:7px; min-height:32px; }
.reading-switch button[aria-pressed="true"] { background:#3a3a3c; border:0; color:#fff; }
/* intitulés de section : gris, petites capitales discrètes ; h3 blanc ; libellés de champ gris en casse normale */
h2, .section-heading h2, .section-heading h3, .cash-trend h2, .agenda-day h2 { color:var(--label); text-transform:uppercase; letter-spacing:.03em; font-size:12px; font-weight:600; }
h3 { color:var(--ink); }
.sheet h3 { color:#fff; text-transform:none; letter-spacing:-.01em; font-size:20px; font-weight:700; }
label { color:var(--label); text-transform:none; letter-spacing:0; font-size:13px; }
th, .detail-table th { color:var(--label); text-transform:none; letter-spacing:0; font-size:12px; font-weight:600; }
.fold>summary { color:var(--primary); text-transform:none; letter-spacing:0; font-size:15px; font-weight:600; }
/* cartes : arrondies, sans bord dur ; séparation par l'espace */
.card, .cal, .vtile, .vplage { background:var(--card); border:0; border-radius:var(--radius); box-shadow:none; }
.card { padding:14px 16px; margin:0 0 12px; }
.card+.card { border-top:0; }
.hm-blk, .hm-list, .hm-tiles { border-radius:var(--radius); overflow:hidden; border-color:transparent; }
/* feuilles : arrondies en haut, poignée, fond de carte */
.sheet { background:var(--card2); border-top:0; border-radius:16px 16px 0 0; position:relative; padding-top:22px; }
.sheet::before { content:""; position:absolute; top:7px; left:50%; width:36px; height:5px; margin-left:-18px; border-radius:3px; background:var(--line2); }
.sheet-close { background:var(--soft) !important; color:var(--ink); border:0 !important; border-radius:999px; }
.toast { background:rgba(44,44,48,.96); color:#fff; border:0; border-radius:14px; -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
/* contrôles segmentés et puces */
.seg { background:var(--soft); border-radius:10px; padding:2px; gap:2px; }
.seg button { background:transparent; color:var(--ink); border-radius:8px; min-height:34px; font-size:13px; font-weight:500; }
.seg button.on { background:#3a3a3c; color:#fff; font-weight:600; }
.chips { gap:8px; }
.chips button, .workspace-tabs button { background:var(--soft); color:var(--ink); border-radius:999px; font-size:13px; font-weight:500; }
.chips button.on, .workspace-tabs button.on { background:var(--primary); color:#fff; }
.chip { border-radius:999px; }
.chip.late { background:var(--amber-t); color:var(--amber); }
/* boutons */
.btn { background:var(--primary); border:0; border-radius:12px; font-size:16px; font-weight:600; letter-spacing:-.01em; min-height:48px; }
.btn.light, .text-action, .calhead button, .calu { background:var(--soft); color:var(--primary); border:0; border-radius:10px; font-weight:600; }
.majapp { background:var(--primary); border-radius:12px; }
/* champs : gris foncé, texte blanc, bord bleu au focus */
input:not([type=checkbox]):not([type=radio]):not([readonly]), select, .fold select, select#uiLanguage, .unit-select, .product-select select, .vpsel select {
  background:var(--field) !important; color:var(--field-ink) !important; border:1px solid var(--btn-line) !important; border-radius:10px; }
input:not([type=checkbox]):not([type=radio]):not([readonly]):focus, select:focus, textarea:focus { border-color:var(--primary) !important; outline:none; box-shadow:0 0 0 3px rgba(10,132,255,.25); }
input::placeholder, textarea::placeholder { color:var(--dim); }
textarea[readonly], input[readonly] { border-radius:10px; }
textarea:not([readonly]) { border:1px solid var(--btn-line); border-radius:10px; }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
/* barre des onglets : translucide, icônes grises, onglet choisi en bleu */
nav { background:var(--nav); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-top:.5px solid var(--line); gap:0; }
nav button { background:transparent; color:var(--muted); font-size:10px; font-weight:500; letter-spacing:0; min-height:50px; }
nav button.on { background:transparent; color:var(--primary); font-weight:600; }
nav button svg { width:24px; height:24px; }
/* calendrier */
.day { background:var(--soft); border-radius:9px; }
.day.today .n { background:var(--primary); color:#fff; border-radius:999px; }
.day.sel { outline:2px solid var(--primary); }
.day .m { border-radius:5px; }
.day .m.late { outline:1px solid var(--amber); }
.wband { background:var(--soft); border-radius:9px; }
/* couleurs de sens et d'état */
.warn { color:var(--amber); } .note, .pending { color:var(--amber); }
.curve path { stroke:var(--primary); }
.version { font-family:inherit; }
/* écran Jour : libellés de tuiles et en-têtes de liste gris (plus de jaune) */
.hm-tile small, .hm-h, .hm-more, .hm-sub103a, .c88head, .c88sum small, .mk-head .mk-name, .list103d-t, .ou103f-l { color:var(--label); }
.hm-tile small, .hm-sub103a { text-transform:none; letter-spacing:0; font-size:11.5px; }
.hm-more { color:var(--primary); }

/* round 104 css f */
/* ================= round 104 · piste f : APPARENCE, gestes, squelette, feuilles Outils et Apparence =================
   Attributs de <html> posés avant le premier dessin (script de l'en-tête) : data-theme (effectif : dark / light), data-th104f (choix :
   dark / light / auto), data-tx104f (s / l / xl), data-de104f (compact), data-ac104f (indigo / violet / graphite), data-co104f (contraste
   renforcé), data-an104f (off : animations réduites). Défaut = attribut absent = base 104 (sombre). Thème clair : mêmes rôles que la base
   104 (titres encre, libellés gris, bleu pour agir, vert entrée, rouge sortie, orange seulement pour alerter), couleurs iOS lisibles sur
   blanc (petits textes ≥ 4,5:1) ; sélecteurs [data-th104f] pour passer devant les jetons de la base, quel que soit l'ordre des pistes.
   Pour les autres pistes : écrire les couleurs en jetons (--ink, --white, --label, --card…), jamais #fff / #000 en dur, et le thème clair suit. */
html:root[data-th104f] { --cel104f:#2a2a2d; --sep104f:#3a3a3e; --ring104f:rgba(10,132,255,.3); --sel104f:rgba(10,132,255,.18); }
html:root[data-theme="light"][data-th104f] {
  --bg:#f2f2f7; --card:#fff; --card2:#f2f2f7; --ink:#1c1c1e; --muted:#6c6c70; --label:#6c6c70; --dim:#8a8a8e; --white:#000;
  --line:#e5e5ea; --line2:#d1d1d6; --soft:#e9e9ee; --cell:#fff; --nav:rgba(249,249,251,.86); --head:#f9f9fb; --shadow:rgba(0,0,0,.06); --back:rgba(0,0,0,.3);
  --primary:#007aff; --on-primary:#fff; --key:#007aff; --tab-on:#007aff; --tab:#e9e9ee; --tab-ink:#1c1c1e;
  --in:#248a3d; --in-t:rgba(52,199,89,.15); --out:#d70015; --out-t:rgba(255,59,48,.12); --amber:#b25000; --amber-t:rgba(255,149,0,.16);
  --teal:#00739c; --teal-t:rgba(50,173,230,.15); --gl:rgba(52,199,89,.15); --gc:rgba(255,59,48,.12);
  --fix:#1d5fbf; --fix-t:#e3edfb; --idx:#8a5200; --idx-t:#fdf1dc; --sw:#6b3fc4; --sw-t:#efe9fb; --stk0:#8a94a3;
  --btn:#e9e9ee; --btn-line:#c7c7cc; --field:#fff; --field-ink:#1c1c1e; --bar-hot:#e5e5ea; --bar-line:#d1d1d6;
  --v-long:#1f7a4d; --v-short:#b3261e; --v-swap:#2563c9; --v-nc:#c25e00; --v-fixe:#334155; --v-idx:#7c3aed; --v-nv:#7d8794;
  --v-long-rgb:31,122,77; --v-short-rgb:179,38,30; --v-swap-rgb:37,99,201; --v-long-t:#16603b; --v-short-t:#9c1f18; --v-nc-t:#8a4300; --v-swap-t:#1d4fa3;
  --va1:.12; --va2:.28; --va3:.46; --va4:.66; --va5:1; --vt1:#000; --vt2:#000; --vt3:#000; --vt4:#000; --vt5:#fff;
  --cel104f:#fff; --sep104f:#e5e5ea; --ring104f:rgba(0,122,255,.25); --sel104f:rgba(0,122,255,.1); color-scheme:light;
}
/* thème clair : ce que la base peint encore en dur (fond noir, titres blancs, rangées noires, courbes) */
html[data-theme="light"], html[data-theme="light"] body { background:var(--bg); }
html[data-theme="light"] header { background:linear-gradient(#000 0 var(--sa-t, 0px), rgba(249,249,251,.86) var(--sa-t, 0px)); }   /* sous l'heure de l'iPhone (blanche tant que l'app n'est pas relancée) : bande sombre */
html[data-theme="light"] header h1, html[data-theme="light"] header h1.brand, html[data-theme="light"] .fbar h2, html[data-theme="light"] .reading-head .page-title,
html[data-theme="light"] .page-title, html[data-theme="light"] .sheet h3 { color:var(--ink); }
html[data-theme="light"] .seg button.on, html[data-theme="light"] .reading-switch button[aria-pressed="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.13), 0 0 0 .5px rgba(0,0,0,.05) !important; }
html[data-theme="light"] .hm-op, html[data-theme="light"] .mk-row, html[data-theme="light"] .hm-tot103a, html[data-theme="light"] .mk-chart { background:var(--card); }
html[data-theme="light"] .hm-kv, html[data-theme="light"] .hm-op, html[data-theme="light"] .mk-row, html[data-theme="light"] .hm-more, html[data-theme="light"] .hm-empty,
html[data-theme="light"] .hm-sub103a, html[data-theme="light"] .mk-leg div, html[data-theme="light"] .mk-tab td { border-color:var(--line); }
html[data-theme="light"] .mk-row.on { background:var(--sel104f); }
html[data-theme="light"] .mk-chart line[stroke="#1c232b"] { stroke:var(--line); }
html[data-theme="light"] .mk-chart line[stroke="#2c343e"] { stroke:var(--line2); }
html[data-theme="light"] .mk-chart text[fill="#8a8a8a"] { fill:var(--muted); }
html[data-theme="light"] .mk-chart rect[fill="#000"] { fill:var(--card); }
html[data-theme="light"] .mk-chart rect[fill="#4a505a"] { fill:var(--line2); }
html[data-theme="light"] .mk-chart #xh { stroke:var(--ink); }
html[data-theme="light"] .jn103b button, html[data-theme="light"] .pe103 button { color:var(--ink); }
html[data-theme="light"] #btnOutils103f.mq, html[data-theme="light"] .nb103a { color:#fff; }
/* couleur d'action (jamais vert, rouge ni orange : couleurs de sens) ; anneau de saisie à la même couleur */
html:root[data-th104f][data-ac104f="indigo"] { --primary:#5e5ce6; --key:#5e5ce6; --tab-on:#5e5ce6; --ring104f:rgba(94,92,230,.34); --sel104f:rgba(94,92,230,.2); }
html:root[data-th104f][data-ac104f="violet"] { --primary:#bf5af2; --key:#bf5af2; --tab-on:#bf5af2; --ring104f:rgba(191,90,242,.32); --sel104f:rgba(191,90,242,.18); }
html:root[data-th104f][data-ac104f="graphite"] { --primary:#858589; --key:#858589; --tab-on:#858589; --ring104f:rgba(142,142,147,.35); --sel104f:rgba(142,142,147,.2); }
html:root[data-theme="light"][data-th104f][data-ac104f="indigo"] { --primary:#5856d6; --key:#5856d6; --tab-on:#5856d6; --ring104f:rgba(88,86,214,.25); --sel104f:rgba(88,86,214,.1); }
html:root[data-theme="light"][data-th104f][data-ac104f="violet"] { --primary:#a344d3; --key:#a344d3; --tab-on:#a344d3; --ring104f:rgba(163,68,211,.25); --sel104f:rgba(163,68,211,.1); }
html:root[data-theme="light"][data-th104f][data-ac104f="graphite"] { --primary:#48484a; --key:#48484a; --tab-on:#48484a; --ring104f:rgba(72,72,74,.25); --sel104f:rgba(72,72,74,.1); }
html[data-th104f] input:not([type=checkbox]):not([type=radio]):not([readonly]):focus, html[data-th104f] select:focus, html[data-th104f] textarea:focus { box-shadow:0 0 0 3px var(--ring104f); }
/* contraste renforcé : gris plus clairs (plus foncés en clair), filets marqués, barres opaques (sans flou : aussi moins de calcul au défilement) */
html:root[data-th104f][data-co104f] { --muted:#aeaeb2; --label:#aeaeb2; --dim:#8e8e93; --line:#3a3a3c; --line2:#545458; --btn-line:#636366; --sep104f:#545458; }
html:root[data-theme="light"][data-th104f][data-co104f] { --muted:#3c3c43; --label:#3c3c43; --dim:#636366; --line:#c6c6c8; --line2:#aeaeb2; --btn-line:#8e8e93; --soft:#e5e5ea; --sep104f:#c6c6c8; }
html[data-co104f] header, html[data-co104f] nav { -webkit-backdrop-filter:none; backdrop-filter:none; }
html[data-co104f] header { background:#000; } html[data-co104f] nav { background:#121214; }
html[data-theme="light"][data-co104f] header { background:linear-gradient(#000 0 var(--sa-t, 0px), #fff var(--sa-t, 0px)); } html[data-theme="light"][data-co104f] nav { background:#fff; }
html[data-co104f] .card:not(:focus-visible), html[data-co104f] .hm-blk:not(:focus-visible), html[data-co104f] .hm-list, html[data-co104f] .hm-tiles, html[data-co104f] .vtile:not(:focus-visible) { outline:1px solid var(--line2); outline-offset:-1px; }
/* taille du texte : tout le contenu des pages et des feuilles à l'échelle (mise en page refaite à la largeur de l'écran : rien ne déborde) */
html[data-tx104f="s"] { --z104f:.92; } html[data-tx104f="l"] { --z104f:1.1; } html[data-tx104f="xl"] { --z104f:1.22; }
html[data-tx104f] main, html[data-tx104f] .sheet { zoom:var(--z104f); }
html[data-tx104f] .sheet { max-height:calc((100dvh - var(--sa-t, 0px) - 10px) / var(--z104f)); }
html[data-tx104f] body.exposure-screen #main { overflow-y:auto; }
/* densité compacte : moins de blanc entre les blocs ; les hauteurs minimales des cibles de toucher (44 px) ne sont pas touchées */
html[data-de104f="compact"] main { padding-top:12px; }
html[data-de104f="compact"] .card { padding:10px 14px; margin-bottom:8px; }
html[data-de104f="compact"] .fbar, html[data-de104f="compact"] .reading-head { margin-bottom:8px; }
html[data-de104f="compact"] .fbar h2, html[data-de104f="compact"] .reading-head .page-title, html[data-de104f="compact"] .page-title { font-size:23px !important; }
html[data-de104f="compact"] h2 { margin-top:10px; margin-bottom:6px; }
html[data-de104f="compact"] .kv { padding:3px 0; }
html[data-de104f="compact"] .hm-tiles, html[data-de104f="compact"] .hm-blk, html[data-de104f="compact"] .hm-list { margin-bottom:8px; }
html[data-de104f="compact"] .hm-blk { padding-top:8px; padding-bottom:8px; }
html[data-de104f="compact"] .hm-tile { padding-top:6px; padding-bottom:5px; }
html[data-de104f="compact"] .op { padding-top:9px; padding-bottom:9px; }
html[data-de104f="compact"] .agenda-day { margin:12px 0; }
html[data-de104f="compact"] .cash-row { padding:10px 0; }
html[data-de104f="compact"] .inventory-row, html[data-de104f="compact"] .delivery-route { padding-top:10px; padding-bottom:10px; }
html[data-de104f="compact"] .route-month > summary { padding:10px 0; }
html[data-de104f="compact"] .ou103f-t > summary { padding-top:9px; padding-bottom:9px; }
html[data-de104f="compact"] .sheet { padding-top:18px; }
/* animations réduites (réglage) : aucune animation ni transition, défilement sans glissé ; sinon celles de l'appareil (prefers-reduced-motion) */
html[data-an104f="off"] *, html[data-an104f="off"] *::before, html[data-an104f="off"] *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; }
/* feuilles : montée douce et fond qui s'assombrit ; elles suivent le doigt vers le bas (glisse104f) ; plus de cadre bleu autour à l'ouverture */
.sheet:focus, .sheet:focus-visible { outline:none; }
@media (prefers-reduced-motion:no-preference) {
  .sheet-bg { animation:fond104f .18s ease-out; }
  .sheet { animation:monte104f .22s cubic-bezier(.2,.8,.25,1); transition:transform .2s cubic-bezier(.2,.8,.25,1); }
  .sheet.glisse104f { transition:none; }
}
@keyframes fond104f { from { opacity:0; } }
@keyframes monte104f { from { transform:translateY(36px); } }
/* tirer pour actualiser : pastille sous l'en-tête, qui suit le doigt, bleue quand on peut relâcher, qui tourne pendant la lecture */
.ptr104f { position:fixed; z-index:8; left:50%; top:calc(var(--sa-t, 0px) + 58px); width:36px; height:36px; margin-left:-18px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; background:var(--card2); color:var(--primary); font-size:19px; font-weight:600;
  box-shadow:0 2px 12px rgba(0,0,0,.28); opacity:0; transform:translateY(-44px); pointer-events:none; }
.ptr104f span { display:block; line-height:1; }
.ptr104f.pret104f { background:var(--primary); color:#fff; }
@media (prefers-reduced-motion:no-preference) { .ptr104f { transition:opacity .15s; } .ptr104f.go104f span { animation:tourne104f .9s linear infinite; } }
@keyframes tourne104f { to { transform:rotate(360deg); } }
/* squelette de l'écran pendant le premier chargement (blocs fixes, aucune animation) ; ↻ qui tourne pendant une relecture */
.sk104f { padding:4px 0 0; }
.sk104f i { display:block; height:86px; margin:0 0 12px; border-radius:var(--radius, 14px); background:var(--card); }
.sk104f i.t { width:46%; height:30px; margin:4px 0 18px; border-radius:8px; background:var(--soft); }
.sk104f i.l { height:210px; }
#btnRefresh.tourne104f { color:var(--label); }
@media (prefers-reduced-motion:no-preference) { #btnRefresh.tourne104f { animation:tourne104f .9s linear infinite; } }
/* interrupteur (mode réunion, contraste) : piste grise, bouton blanc ; allumé : couleur d'action */
.int104f::after { content:""; flex:none; width:51px; height:31px; border-radius:999px; background:radial-gradient(circle at 15.5px 50%, #fff 0 13px, transparent 13.5px) no-repeat var(--line2); }
.int104f[aria-checked="true"]::after { background-color:var(--primary); background-position:20px 0; }
@media (prefers-reduced-motion:no-preference) { .int104f::after { transition:background-color .2s, background-position .2s; } .ou103f-t > summary::after { transition:transform .2s; } }
/* Outils (piste f du round 103) au style 104 : rangées arrondies, titre encre en casse normale, sous-titre gris, chevron ; plus d'orange
   décoratif (le bouton OUTILS reste orange seulement quand le mode réunion masque les chiffres : un état à signaler) */
#btnOutils103f { font-family:inherit; font-size:15px; font-weight:600; letter-spacing:.02em; padding:4px 8px; }
#btnOutils103f.mq { background:var(--amber); color:#000; border-radius:999px; padding:4px 12px; }
.ou103f-sh .ou103f-n { margin:0 0 14px; }
.ou103f-mq { display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:10px 16px; margin:0 0 8px; border:0; border-radius:var(--radius);
  background:var(--cel104f, var(--card)); color:var(--ink); font-family:inherit; font-size:16px; font-weight:600; line-height:1.25; text-align:left; letter-spacing:-.01em; }
.ou103f-mq.on { background:var(--cel104f, var(--card)); color:var(--ink); }
.ou103f-mq > span { flex:1; min-width:0; }

.ou103f-top { margin:0 0 4px; }
.ou103f-top .ou103f-x { margin:0 4px 14px; }

  background:var(--cel104f, var(--card)); color:var(--ink); font-family:inherit; font-size:16px; font-weight:600; line-height:1.25; text-align:left; letter-spacing:-.01em; }
