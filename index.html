<title>Atlas</title>
<style>
:root { --bg:#f4f5f7; --card:#fff; --ink:#1c2430; --muted:#7a828e; --line:#e3e6ea; --primary:#1f3a5f; --in:#1f7a4d; --in-t:#e6f3ec; --out:#b3261e; --out-t:#fbeaea; --amber:#a86400; --amber-t:#fdf1dc; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--primary); color:#fff; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:10px; }
header h1 { font-size:19px; margin:0; flex:1; font-weight:650; }
header .sub { font-size:12px; opacity:.8; }
header button { background:rgba(255,255,255,.15); border:0; color:#fff; border-radius:10px; padding:7px 10px; font-size:14px; }
main { padding:12px 12px calc(env(safe-area-inset-bottom) + 84px); max-width:720px; margin:0 auto; }
nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:6; }
nav button { flex:1; border:0; background:none; padding:9px 0 8px; font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; }
nav button svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
nav button.on { color:var(--primary); font-weight:650; }
.card { background:var(--card); border-radius:14px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; min-width:0; }
.muted { color:var(--muted); font-size:13px; }
.big { font-size:26px; font-weight:700; }
.chip { display:inline-block; font-size:12px; padding:3px 8px; border-radius:999px; background:#eef0f3; color:var(--ink); white-space:nowrap; }
.chip.in { background:var(--in-t); color:var(--in); } .chip.out { background:var(--out-t); color:var(--out); } .chip.late { background:var(--amber-t); color:var(--amber); }
.chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; }
.chips button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 12px; font-size:14px; white-space:nowrap; color:var(--ink); }
.chips button.on { background:var(--primary); border-color:var(--primary); color:#fff; }
.cal { background:#fff; border-radius:14px; padding:10px 8px 6px; margin-bottom:10px; }
.calhead { display:flex; align-items:center; justify-content:space-between; padding:0 6px 8px; }
.calhead b { font-size:17px; text-transform:capitalize; }
.calhead button { border:0; background:#eef0f3; border-radius:10px; width:38px; height:34px; font-size:18px; color:var(--ink); }
.grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.dow { text-align:center; font-size:11px; color:var(--muted); padding-bottom:4px; }
.day { min-height:52px; border-radius:10px; padding:4px 3px; text-align:center; font-size:14px; position:relative; background:#fafbfc; border:0; color:var(--ink); }
.day.other { opacity:.35; }
.day.today .n { background:var(--primary); color:#fff; border-radius:999px; padding:1px 6px; }
.day.sel { outline:2px solid var(--primary); }
.day .marks { display:flex; flex-direction:column; gap:2px; margin-top:3px; align-items:center; }
.day .m { font-size:10.5px; font-weight:650; border-radius:6px; padding:0 4px; line-height:15px; }
.day .m.in { background:var(--in-t); color:var(--in); } .day .m.out { background:var(--out-t); color:var(--out); }
.op { display:flex; gap:10px; align-items:stretch; }
.op .bar { width:4px; border-radius:4px; background:var(--muted); }
.op.in .bar { background:var(--in); } .op.out .bar { background:var(--out); }
.op .q { font-weight:700; font-size:17px; }
h2 { font-size:15px; margin:16px 4px 8px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
table { width:100%; border-collapse:collapse; font-size:14px; }
td,th { padding:7px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
td:first-child,th:first-child { text-align:left; }
th { font-size:12px; color:var(--muted); font-weight:600; }
.scroll { overflow-x:auto; }
.neg { color:var(--out); } .pos { color:var(--in); }
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:flex; align-items:flex-end; }
.sheet { background:#fff; width:100%; max-width:720px; margin:0 auto; border-radius:18px 18px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:92vh; overflow:auto; }
.sheet h3 { margin:0 0 4px; font-size:19px; }
label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
input,textarea { width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:#fafbfc; color:var(--ink); font-family:inherit; }
.seg { display:flex; background:#eef0f3; border-radius:12px; padding:3px; }
.seg button { flex:1; border:0; background:none; padding:10px 0; border-radius:10px; font-size:15px; color:var(--ink); }
.seg button.on { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); font-weight:650; }
.btn { width:100%; border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:650; background:var(--primary); color:#fff; margin-top:18px; }
.btn:disabled { opacity:.5; }
.btn.light { background:#eef0f3; color:var(--ink); margin-top:8px; }
.center { text-align:center; padding:40px 20px; }
.pending { font-size:12px; color:var(--amber); }
.refused { font-size:12px; color:var(--out); }
.note { font-size:12px; color:var(--amber); margin-top:2px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 90px); background:#1c2430; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:30; max-width:90vw; }
.bars .b { height:10px; border-radius:6px; background:var(--primary); }
</style>
</head>

  <div class="grow"><h1 id="title">Atlas</h1><div class="sub" id="sub"></div></div>

<!-- bibliothèque Microsoft (MSAL) 4.30.0, version LTS : adresse vérifiée le 04/10/2026 (HTTP 200, nom global « msal »), empreinte contrôlée par le navigateur -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js" integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ" crossorigin="anonymous"></script>
<script>
"use strict";
// ================= Atlas mobile =================
// Lit la fiche exportée par Atlas dans le dossier OneDrive partagé (Telephone\Head ou Telephone\Logistique), et écrit chaque modification
// dans un petit fichier (sous-dossier « modifs ») qu'Atlas reprend sur le PC, au nom de la personne. Aucune donnée n'est stockée ailleurs.
const CONFIG = { clientId: "478abaf6-f241-4911-ab57-79c2d7d8c995" };   // identifiant de l'application enregistrée chez Microsoft (rempli au déploiement ; modifiable dans Réglages)
const SCOPES = ["Files.ReadWrite.All", "User.Read"];
const G = "https://graph.microsoft.com/v1.0";
const T = {
  fr: { cal:"Calendrier", deliv:"Livraisons", stock:"Stock", pnl:"P&L", expo:"Exposition", settings:"Réglages", login:"Se connecter avec Microsoft",
        loginTxt:"Connectez-vous avec le compte Microsoft avec lequel le dossier Atlas vous a été partagé.", data:"Données du", none:"Rien ce jour-là",
        planned:"Prévu", delivered:"Livré", cancelled:"Annulé", late:"en retard", receipt:"Réception", delivery:"Livraison", qty:"Quantité (lb)",
        date:"Date", carrier:"Transporteur", comment:"Commentaire", save:"Enregistrer", cancel:"Fermer", sent:"Envoyé : Atlas le reprendra sur le PC",
        pending:"en attente de reprise par Atlas", upcoming:"À venir", lateF:"En retard", done:"Livrées", all:"Tout", count:"Compter", counted:"Quantité comptée (lb)",
        countDate:"Date du comptage", realised:"Réalisé", forecast:"Prévu", swaps:"Swaps", total:"Total", byProduct:"Par produit", byMonth:"Par mois",
        floating:"hors totaux : {0} à prix flottant", searching:"Recherche du dossier Atlas…",
        notFound:"Aucune fiche Atlas trouvée. Collez le lien du dossier reçu par e-mail, puis Enregistrer.", folderLink:"Lien de partage du dossier (reçu par e-mail)",
        badLink:"Lien non reconnu", clientId:"Identifiant de l'application (client ID)", logout:"Se déconnecter", folder:"Dossier", reset:"Changer de dossier",
        noData:"Aucune donnée", lot:"Lot", location:"Lieu", refused:"refusé par Atlas", noMargin:"{0} sans marge", toConfirm:"{0} à confirmer",
        kept:"Pas envoyé (réseau ou connexion) : gardé sur le téléphone, envoi automatique", offline:"Pas de réseau", authErr:"Connexion Microsoft refusée : {0}", retry:"↻ pour réessayer",
        noLib:"Bibliothèque Microsoft non chargée", locked:"Livraison confirmée ou facturée : statut, date et quantité se modifient dans Atlas", status:"Statut",
        futureDone:"Une livraison réalisée ne peut pas être datée dans le futur",
        choose:"Plusieurs comptes Microsoft sont connectés sur ce téléphone : choisissez le vôtre.", denied:"Accès refusé à ce dossier pour {0}",
        noFile:"fiche absente du dossier pour l'instant (Atlas la réécrit) : {0}", lastKept:"dernière fiche gardée", blocked:"Bloquée : OneDrive refuse l'envoi (voir Réglages)",
        blockedList:"Modifications bloquées (jamais retirées d'office)", retryBtn:"Réessayer", copy:"Copier", copied:"Copié", drop:"Abandonner", dropConfirm:"Confirmer l'abandon",
        dropBusy:"Envoi en cours : abandon impossible",
        dropDeps:"{0} modification(s) saisie(s) ensuite sur la même livraison partent de l'état que celle-ci donne : abandonnée seule, Atlas refusera leur reprise",
        dropAll:"Abandonner aussi ces {0}", dropOne:"Abandonner celle-ci seule", dropOneDone:"Abandonnée seule : Atlas refusera la reprise des {0} modification(s) suivante(s)",
        boxKept:"{0} modification(s) pas encore envoyée(s) : gardée(s) sur ce téléphone pour {1}, renvoyée(s) à sa prochaine connexion",
        boxBlocked:"{0} bloquée(s) : Réglages › Réessayer", boxBlockedIci:"{0} bloquée(s) : Réessayer ci-dessus", lineBlocked:"Modification bloquée sur cette ligne : Réglages › Réessayer ou Abandonner d'abord",
        other:"Utiliser un autre compte", sheetClosed:"saisie en cours fermée, rien n'a été envoyé", noSheet:"fiche, dossier ou compte absent : rien n'est gardé",
        orphans:"{0} modification(s) d'une ancienne version de l'app mise(s) de côté : jamais envoyée(s)", demoSent:"Démo : rien n'est envoyé",
        week:["L","M","M","J","V","S","D"], months:["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"], demo:"Démo (données d'exemple)" },
  en: { cal:"Calendar", deliv:"Deliveries", stock:"Inventory", pnl:"P&L", expo:"Exposure", settings:"Settings", login:"Sign in with Microsoft",
        loginTxt:"Sign in with the Microsoft account the Atlas folder was shared with.", data:"Data of", none:"Nothing that day",
        planned:"Planned", delivered:"Delivered", cancelled:"Cancelled", late:"late", receipt:"Receipt", delivery:"Delivery", qty:"Quantity (lb)",
        date:"Date", carrier:"Carrier", comment:"Comment", save:"Save", cancel:"Close", sent:"Sent: Atlas will apply it on the PC",
        pending:"waiting for Atlas", upcoming:"Upcoming", lateF:"Late", done:"Delivered", all:"All", count:"Count", counted:"Counted quantity (lb)",
        countDate:"Count date", realised:"Realised", forecast:"Forecast", swaps:"Swaps", total:"Total", byProduct:"By product", byMonth:"By month",
        floating:"not in totals: {0} floating-price", searching:"Looking for the Atlas folder…",
        notFound:"No Atlas sheet found. Paste the folder link you received by e-mail, then Save.", folderLink:"Folder sharing link (from the e-mail)",
        badLink:"Link not recognised", clientId:"Application (client) ID", logout:"Sign out", folder:"Folder", reset:"Change folder",
        noData:"No data", lot:"Lot", location:"Location", refused:"rejected by Atlas", noMargin:"{0} without margin", toConfirm:"{0} to confirm",
        kept:"Not sent (network or sign-in): kept on the phone, will be sent automatically", offline:"No network", authErr:"Microsoft sign-in failed: {0}", retry:"tap ↻ to retry",
        noLib:"Microsoft library not loaded", locked:"Delivery confirmed or invoiced: status, date and quantity are changed in Atlas", status:"Status",
        futureDone:"A delivered line cannot be dated in the future",
        choose:"Several Microsoft accounts are signed in on this phone: choose yours.", denied:"Access to this folder denied for {0}",
        noFile:"sheet missing from the folder for now (Atlas rewrites it): {0}", lastKept:"last sheet kept", blocked:"Blocked: OneDrive refuses the upload (see Settings)",
        blockedList:"Blocked changes (never removed automatically)", retryBtn:"Retry", copy:"Copy", copied:"Copied", drop:"Abandon", dropConfirm:"Confirm abandon",
        dropBusy:"Upload in progress: cannot abandon",
        dropDeps:"{0} later change(s) on the same delivery start from the state this one gives: if it is abandoned alone, Atlas will reject them",
        dropAll:"Also abandon these {0}", dropOne:"Abandon this one only", dropOneDone:"Abandoned alone: Atlas will reject the {0} later change(s)",
        boxKept:"{0} change(s) not sent yet: kept on this phone for {1}, sent at their next sign-in",
        boxBlocked:"{0} blocked: Settings › Retry", boxBlockedIci:"{0} blocked: Retry above", lineBlocked:"A blocked change is waiting on this line: Settings › Retry or Abandon first",
        other:"Use another account", sheetClosed:"open entry closed, nothing was sent", noSheet:"no sheet, folder or account: nothing kept",
        orphans:"{0} change(s) from an earlier version of the app set aside: never sent", demoSent:"Demo: nothing is sent",
        week:["M","T","W","T","F","S","S"], months:["January","February","March","April","May","June","July","August","September","October","November","December"], demo:"Demo (sample data)" } };
const ls = { get(k, d) { try { const v = localStorage.getItem("atlas." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem("atlas." + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
             del(k) { try { localStorage.removeItem("atlas." + k); } catch (e) {} } };
// mémoire du téléphone (round 19, point 1) : seules la langue (lang) et l'identifiant de l'application (clientId) sont communes ; tout le reste est
// rangé par compte Microsoft (homeAccountId : identifiant stable, qui contient l'annuaire), et la fiche, les attentes et les refus aussi par
// dossier : « u.<compte>.<clé> » et « u.<compte>.d.<driveId>!<folderId>.<clé> » ; un compte ne lit jamais l'espace d'un autre
const dosId = p => p.driveId + "!" + p.folderId;
const kU = (h, k) => "u." + h + "." + k;
const kD = (h, p, k) => "u." + h + ".d." + dosId(p) + "." + k;
const moi = () => DEMO ? "demo" : (account && account.homeAccountId) || null;   // propriétaire de ce qui est affiché, gardé et envoyé
const us = { get: (k, d) => moi() ? ls.get(kU(moi(), k), d) : d, set: (k, v) => !!moi() && ls.set(kU(moi(), k), v) };
const ds = { get: (k, d) => moi() && place ? ls.get(kD(moi(), place, k), d) : d, set: (k, v) => !!(moi() && place) && ls.set(kD(moi(), place, k), v),
             del: k => { if (moi() && place) ls.del(kD(moi(), place, k)); } };
// clés de la version certifiée (round 18), sans propriétaire : effacées ; seule la boîte d'envoi est mise de côté (« orphelin.outbox »), jamais
// envoyée, jamais affichée, jamais attribuée au compte qui se connecte (amendement d)
function migrer() {
  const v = ls.get("outbox", null), ok = !(Array.isArray(v) && v.length) || ls.set("orphelin.outbox", [].concat(ls.get("orphelin.outbox", []) || [], v));
  ["cache", "place", "pending", "refus", "outbox", "folderLink", "tab"].forEach(k => { if (k !== "outbox" || ok) ls.del(k); });
}
let lang = ls.get("lang", (navigator.language || "fr").startsWith("fr") ? "fr" : "en");
const t = k => (T[lang][k] != null ? T[lang][k] : k);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const nf = (v, d) => v == null || isNaN(v) ? "—" : Number(v).toLocaleString(lang === "fr" ? "fr-FR" : "en-US", { maximumFractionDigits: d || 0 });
const money = v => v == null ? "—" : (Math.abs(v) >= 1e6 ? nf(v / 1e6, 2) + " M$" : nf(v) + " $");
const cm = v => v == null ? "—" : Math.abs(v) >= 1e6 ? nf(v / 1e6, 1) + " M" : Math.abs(v) >= 1e3 ? nf(v / 1e3) + " k" : nf(v);   // montants compacts des tableaux
const short = v => Math.abs(v) >= 1000 ? nf(v / 1000, v >= 10000 ? 0 : 1) + "k" : nf(v);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseD = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
const fmtD = s => { const d = parseD(s); return d ? d.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-US", { day:"2-digit", month:"short" }) : ""; };
// livraison connue au mois : mois mis en forme dans la langue de l'app (la fiche donne « aaaa-mm »)
const fmtM = s => { const d = parseD(s); return d ? d.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-US", { month:"short", year:"numeric" }) : ""; };
const DEMO = location.search.includes("demo");
// libellés traduits par l'app (la fiche d'Atlas donne des codes) : produits et lignes de l'exposition
const PROD = { fr: { "Molybdène": "Molybdène" }, en: { "Molybdène": "Molybdenum" } };
const prod = c => (PROD[lang][c] || c);
const EXPO = { fr: { ouverture: "Stock d'ouverture", achats: "Achats", ventes: "Ventes", net: "Flux net", cloture: "Stock de clôture", manque: "Manque" },
               en: { ouverture: "Opening stock", achats: "Purchases", ventes: "Sales", net: "Net flow", cloture: "Closing stock", manque: "Shortfall" } };
// « aujourd'hui » recalculé à chaque rendu et au retour au premier plan (l'app peut rester ouverte d'un jour à l'autre)
const todayIso = () => iso(new Date());
let today = todayIso();

// place, tab, pending, refus et la fiche sont lus dans l'espace du compte actif au démarrage (ouvrir), jamais avant de connaître ce compte
let pca = null, account = null, comptes = [], authFailed = null, data = null, place = null, tab = "cal", calMonth = null, selDay = null, delivFilter = "upcoming";
// modifications envoyées du dossier affiché (« réf|champ » → valeur, fichier, heure UTC) : levées quand la fiche d'Atlas cite LEUR fichier parmi les fichiers repris
let pending = {};
// refus d'Atlas du dossier affiché, par livraison ou lot (« réf » → texte, heure), montrés sur la carte jusqu'à un nouvel envoi (14 jours au plus)
let refus = {};
// écran sans fiche affiché (Accès refusé, lien du dossier, erreur au démarrage) : render() le redessine (abandon, Réessayer, langue) ; nul ailleurs
let sansFiche = null;
// saisies retirées de la boîte par un envoi réussi : seules celles-là sont annoncées « Envoyé »
const envoyees = new Set();
// espace du compte actif : son dossier, son onglet, et la fiche, les attentes et les refus de CE dossier ; la fiche n'est montrée que si elle
// appartient à ce compte et à ce dossier (point 3)
function ouvrir() {
  place = us.get("place", null); tab = us.get("tab", "cal");
  const c = ds.get("cache", null);
  data = c && place && c.owner === moi() && c.dossier === dosId(place) ? c.fiche : null;
  pending = ds.get("pending", {}); refus = ds.get("refus", {});
}

// un message n'en masque jamais un autre : le précédent est retiré (revue 3, défaut 12)
function toast(s) { document.querySelectorAll(".toast").forEach(x => x.remove()); const d = document.createElement("div"); d.className = "toast"; d.textContent = s; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }

// ---------- Microsoft (MSAL) et OneDrive (Graph) ----------
async function initAuth() {
  const id = ls.get("clientId", CONFIG.clientId);
  if (!id) return false;
  // clé du texte gardée avec l'erreur (e.cle) : l'écran d'erreur le recompose dans la langue du moment
  if (!window.msal || !window.msal.PublicClientApplication) throw Object.assign(new Error(t("noLib")), { cle: "noLib" });
  pca = new window.msal.PublicClientApplication({ auth: { clientId: id, authority: "https://login.microsoftonline.com/common", redirectUri: location.origin + location.pathname },
                                                   cache: { cacheLocation: "localStorage" } });
  await pca.initialize();
  // erreur au retour de Microsoft (consentement refusé, annulation) : affichée, jamais avalée ; pas de nouvelle redirection en boucle
  const r = await pca.handleRedirectPromise().catch(e => { authFailed = e; return null; });
  // compte actif explicite (point 1) : celui qui revient de Microsoft, sinon celui que MSAL garde comme actif ; un seul compte connu : celui-là ;
  // plusieurs comptes sans compte actif : écran de choix, rien n'est affiché (jamais le premier de la liste)
  if (r && r.account) pca.setActiveAccount(r.account);
  let a = pca.getActiveAccount(); comptes = [];
  if (!a) { const tous = pca.getAllAccounts(); if (tous.length === 1) { a = tous[0]; pca.setActiveAccount(a); } else comptes = tous; }
  account = a && a.homeAccountId ? a : null;
  return true;
}
// plusieurs comptes Microsoft sans compte actif : aucune donnée, le choix du compte ; ou un autre compte que ceux de la liste ; le motif d'un
// retour en erreur de Microsoft (« Utiliser un autre compte » annulé) y est affiché ; écran redessiné par render() (langue)

// sur une réf dont elle change le statut, la date, la quantité ou le transporteur ont vu l'état qu'elle donne (Atlas refuserait leur reprise) :

    });
}
function countLot(lot) {
  if (ligneBloquee(lot)) return;
  const l = (data.inventaire || []).find(x => x.lot === lot); if (!l) return;
  const name = newName();
  // date du comptage proposée : le jour où la feuille s'ouvre (jamais le jour du chargement de l'app)
  sheet('<h3>' + esc(prod(l.produit)) + '</h3><div class="muted">' + esc(l.lot) + " · " + nf(l.stock) + ' lb</div><label>' + t("counted") + '</label><input id="q" type="number" inputmode="decimal">' +
    '<label>' + t("countDate") + '</label><input id="d" type="date" value="' + todayIso() + '"><label>' + t("comment") + '</label><textarea id="m" rows="2"></textarea><button class="btn" id="ok">' + t("save") + '</button><button class="btn light" id="ko">' + t("cancel") + '</button>', (bg, close) => {
      bg.querySelector("#ko").onclick = close;
      bg.querySelector("#ok").onclick = async () => {
        const q = parseFloat(bg.querySelector("#q").value), d = bg.querySelector("#d").value, m = bg.querySelector("#m").value.trim(), ch = [];
        // stock affiché au moment du comptage : Atlas refuse le comptage si le stock a bougé depuis (mouvement saisi entre-temps)
        if (!isNaN(q) && q >= 0) ch.push({ t: "inventaire", ref: lot, champ: "compte", valeur: q, date: d, stockVu: l.stock });
        if (m) ch.push({ t: "inventaire", ref: lot, champ: "commentaire", valeur: m });
        if (!ch.length) { close(); return; }
        await submit(bg, close, ch, name);
      };
    });
}
function render() {
  today = todayIso();
  header(); if (!data) { if (sansFiche) sansFiche(); return; } tabs();
  ({ cal: renderCal, deliv: renderDeliv, stock: renderStock, pnl: renderPnl, expo: renderExpo, settings: renderSettings })[tab]();
}
const authMsg = a => a ? t("authErr").replace("{0}", (a.errorMessage || a.message || String(a)).split("\n")[0]) : "";
const authText = () => authMsg(authFailed);
async function boot() {
  sansFiche = null; header();
  try {
    migrer();
    if (!DEMO) {
      const ok = await initAuth();
      if (ok && !account && comptes.length > 1) { choixCompte(); return; }
      if (!ok || !account) {
        data = null; place = null; pending = {}; refus = {}; header();
        $("#nav").innerHTML = "";
        $("#main").innerHTML = '<div class="center"><div class="big" style="margin-bottom:10px">Atlas</div><p class="muted">' + t("loginTxt") + '</p>' + (authFailed ? '<p class="refused">' + esc(authText()) + '</p>' : "") +
          (ok ? '<button class="btn" id="login">' + t("login") + '</button>' : "") + '<label>' + t("clientId") + '</label><input id="cid" autocapitalize="off" autocorrect="off" value="' + esc(ls.get("clientId", CONFIG.clientId)) + '"><button class="btn light" id="saveCid">' + t("save") + '</button></div>';
        if ($("#login")) $("#login").onclick = () => pca.loginRedirect({ scopes: SCOPES });
        $("#saveCid").onclick = () => { ls.set("clientId", $("#cid").value.trim()); location.reload(); };
        return;
      }
      ouvrir(); if (data) render();   // affichage immédiat de la dernière fiche connue de CE compte et de CE dossier
      if (authFailed) toast(authText() + " · " + t("retry"));
      await flush(true).catch(e => console.warn(e));      // modifications gardées sur le téléphone pour CE compte : renvoyées d'abord
    } else ouvrir();
    await load(); render();
  } catch (e) { echec(e, true); }
}
// erreur au démarrage (boot) ou sur ↻
function echec(e, auBoot) {
  console.error(e);
  // jeton refusé après un retour en erreur de Microsoft (garde-fou anti-boucle) : le motif et la façon de réessayer, jamais le message MSAL brut ;
  // une coupure réseau ou une erreur Graph garde son propre message (elles n'ont pas d'errorCode MSAL) (revue 3, défaut 12)
  const auth = !!(authFailed && pca && e && e.errorCode), af = auth ? authFailed : null;
  // motif composé à chaque dessin (langue) : seuls l'erreur et le refus de connexion sont gardés (e.texte : fonction ; e.cle : clé du texte)
  const motif = () => e && e.texte ? e.texte() : auth ? authMsg(af) + " · " + t("retry") : "⚠ " + (e && e.cle ? t(e.cle) : e && e.message), msg = motif();
  // accès refusé (403, ou 404 du dossier) : la fiche est déjà retirée ; une feuille restée ouverte sur elle est fermée ; si son envoi n'avait
  // pas commencé (bouton Enregistrer actif), rien n'est envoyé et c'est dit ; un envoi en cours (bouton désactivé) donnera son propre message
  // (gardée, bloquée ou envoyée) ; écran Accès refusé
  if (e && e.acces) {
    const f = Array.from(document.querySelectorAll(".sheet-bg")), saisie = f.some(x => { const o = x.querySelector("#ok"); return !!o && !o.disabled; }); f.forEach(x => x.remove());
    accesRefuse(msg); toast(saisie ? msg + " · " + t("sheetClosed") : msg); return;
  }
  if (data || !auBoot) { toast(msg); return; }
  ecranErreur(motif, auth);
}
// écrans sans fiche, redessinés par render() (abandon, Réessayer, langue) ; ils gardent les sorties du compte : entrées bloquées (Réessayer,
// Copier, Abandonner) et Se déconnecter
// accès refusé : le motif, le compte, « Changer de dossier »
function accesRefuse(msg) {
  sansFiche = () => accesRefuse(msg); $("#nav").innerHTML = ""; header();
  const box = us.get("outbox", []);
  $("#main").innerHTML = '<div class="center"><p class="refused">' + esc(msg) + '</p><p class="muted">' + esc(t("denied").replace("{0}", (account && account.username) || "")) + '</p>' +
    '<button class="btn light" id="resetPlace">' + t("reset") + '</button>' + htmlBloquees(box) + htmlCompte(box, false, true) + '</div>';
  $("#resetPlace").onclick = changerDossier; lierSorties();
}
// erreur au démarrage sans fiche : le motif (connexion refusée : le bouton de connexion) ; motif : fonction, recomposée à chaque dessin (langue)
function ecranErreur(motif, auth) {
  sansFiche = () => ecranErreur(motif, auth); $("#nav").innerHTML = "";
  const box = us.get("outbox", []), msg = motif();
  $("#main").innerHTML = (auth ? '<div class="center"><p class="refused">' + esc(msg) + '</p><button class="btn" id="relogin2">' + t("login") + '</button>'
                               : '<div class="center"><p class="muted">' + esc(msg) + '</p>') + htmlBloquees(box) + htmlCompte(box, false, true) + '</div>';
  if (auth) $("#relogin2").onclick = () => { authFailed = null; pca.acquireTokenRedirect({ scopes: SCOPES, account }).catch(er => { authFailed = er; toast(authText()); }); };
  lierSorties();
}
$("#btnLang").onclick = () => { lang = lang === "fr" ? "en" : "fr"; ls.set("lang", lang); render(); header(); };
// ↻ : action volontaire, elle peut relancer la connexion Microsoft (authFailed remis à nul) ; si la personne annule de nouveau, initAuth le repose ;
// sans compte actif (connexion, choix du compte, retour arrière après déconnexion) : le démarrage
$("#btnRefresh").onclick = async () => {
  if (!DEMO && !account) return boot();
  authFailed = null; try { await flush().catch(e => console.warn(e)); await load(); render(); } catch (e) { echec(e, false); } };
window.addEventListener("online", () => { flush(true).catch(() => {}); });
// retour au premier plan un autre jour : date du jour, retards et calendrier recalculés (seulement si le jour a changé : une saisie en cours
// dans Réglages n'est pas effacée)
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !data) return;
  const old = today, now = todayIso(); if (now === old) return;
  if (calMonth && iso(calMonth).slice(0, 7) === old.slice(0, 7)) calMonth = null;   // suit le mois courant si l'utilisateur n'avait pas navigué
  const d = document.querySelector(".sheet input#d[type=date]"); if (d && d.value === old && !document.querySelector(".sheet #seg")) d.value = now;   // feuille de comptage restée ouverte
  if (tab !== "settings" && !document.querySelector(".sheet-bg")) render(); else today = now;
});
window.addEventListener("pageshow", e => { if (!e.persisted) return; if (!DEMO && !account) boot(); else document.dispatchEvent(new Event("visibilitychange")); });
// page d'essai : l'app est chargée sans démarrer, les essais appellent ses fonctions
if ("serviceWorker" in navigator && !DEMO && !window.ATLAS_ESSAI) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!window.ATLAS_ESSAI) boot();
</script>
