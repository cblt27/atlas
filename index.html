/* round 23 (piste mobile) : couleurs en variables ; thème clair, sombre, ou celui du système (Réglages › Apparence, gardé sur le téléphone) */

        --fix:#1d5fbf; --fix-t:#e3edfb; --idx:#8a5200; --idx-t:#fdf1dc; --sw:#6b3fc4; --sw-t:#efe9fb; --stk0:#8a94a3; --gl:#e6f3ec; --gc:#fbeaea; }
:root[data-theme="dark"] { --bg:#0e1217; --card:#1a2029; --ink:#e6eaf0; --muted:#9aa3af; --line:#2c3440; --primary:#86b4ec; --on-primary:#0e1217; --head:#142338; --soft:#262d37; --cell:#141a21; --nav:#141a21; --shadow:rgba(0,0,0,.35);
        --in:#5fc28f; --in-t:#16301f; --out:#f28b82; --out-t:#3b1d1b; --amber:#f0b45a; --amber-t:#382a12; --teal:#4fc3b6; --teal-t:#12302c; --back:rgba(0,0,0,.6); color-scheme:dark;
        --fix:#8ab4f8; --fix-t:#17263d; --idx:#f0b45a; --idx-t:#382a12; --sw:#c3a6ff; --sw-t:#2a2140; --stk0:#6b7686; --gl:#16301f; --gc:#3b1d1b; }
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] { --bg:#0e1217; --card:#1a2029; --ink:#e6eaf0; --muted:#9aa3af; --line:#2c3440; --primary:#86b4ec; --on-primary:#0e1217; --head:#142338; --soft:#262d37; --cell:#141a21; --nav:#141a21; --shadow:rgba(0,0,0,.35);
        --in:#5fc28f; --in-t:#16301f; --out:#f28b82; --out-t:#3b1d1b; --amber:#f0b45a; --amber-t:#382a12; --teal:#4fc3b6; --teal-t:#12302c; --back:rgba(0,0,0,.6); color-scheme:dark;
        --fix:#8ab4f8; --fix-t:#17263d; --idx:#f0b45a; --idx-t:#382a12; --sw:#c3a6ff; --sw-t:#2a2140; --stk0:#6b7686; --gl:#16301f; --gc:#3b1d1b; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }

.chip.in { background:var(--in-t); color:var(--in); } .chip.out { background:var(--out-t); color:var(--out); } .chip.late { background:var(--amber-t); color:var(--amber); } .chip.teal { background:var(--teal-t); color:var(--teal); }

.cal { background:var(--card); border-radius:14px; padding:10px 6px 8px; margin-bottom:10px; box-shadow:0 1px 2px var(--shadow); }

.grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; }
.dow { text-align:center; font-size:11px; color:var(--muted); padding-bottom:4px; }

/* jour d'un mois voisin : seul son numéro est grisé (l'opacité effaçait aussi ses vraies quantités) */
.day.other { background:transparent; } .day.other .n { color:var(--muted); }
.day.today .n { background:var(--primary); color:var(--on-primary); border-radius:999px; padding:1px 6px; }
.day.sel { outline:2px solid var(--primary); outline-offset:-2px; }
.day .marks { display:flex; flex-direction:column; gap:2px; margin-top:3px; align-items:center; }
.day .m { font-size:10.5px; font-weight:650; border-radius:6px; padding:0 2px; line-height:14px; max-width:100%; white-space:normal; word-break:keep-all; overflow:hidden; letter-spacing:-.3px; font-variant-numeric:tabular-nums; }
/* round 25 (corrections) : quantité complète dans la case (plus de « k ») : flèche réduite, texte plus petit pour 6 chiffres et plus ; le nombre (insécable)

.day .m i { font-style:normal; font-size:8px; margin-right:1px; white-space:nowrap; } .day .m b { font-weight:inherit; white-space:nowrap; }
.day .m.l6 { font-size:9.5px; } .day .m.l7 { font-size:8.5px; letter-spacing:-.4px; }
.calleg { font-size:11.5px; color:var(--muted); padding:0 6px 6px; }
.day .m.in { background:var(--in-t); color:var(--in); } .day .m.out { background:var(--out-t); color:var(--out); } .day .m.dir { background:var(--teal-t); color:var(--teal); }
.day .m.late { box-shadow:inset 0 0 0 1px var(--amber); }
.wband { grid-column:1 / -1; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); background:var(--soft); border-radius:8px; padding:4px 8px; margin:0 0 5px; border:0; text-align:left; font-family:inherit; min-height:26px; }
.wband b { color:var(--ink); font-weight:650; }
.wband .grow { white-space:normal; overflow:hidden; }   /* round 25 (corrections) : nombres complets : le bandeau passe à la ligne au lieu de couper (« … ») */
.neg, .wband .neg { color:var(--out); } .pos { color:var(--in); } .warn { color:var(--amber); }
.op { display:flex; gap:10px; align-items:stretch; }
.op .bar { width:4px; border-radius:4px; background:var(--muted); flex:none; }
.op.in .bar { background:var(--in); } .op.out .bar { background:var(--out); } .op.dir .bar { background:var(--teal); }
.op .q { font-weight:700; font-size:17px; white-space:nowrap; }
h2 { font-size:13px; margin:16px 4px 8px; color:var(--muted); font-weight:650; text-transform:uppercase; letter-spacing:.03em; }
table { width:100%; border-collapse:collapse; font-size:14px; }

.scroll { overflow-x:auto; }

.kv span:first-child { color:var(--muted); }
.kv span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
.metrics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 12px; margin-top:6px; }
.metrics div { min-width:0; } .metrics small { display:block; color:var(--muted); font-size:12px; } .metrics b { font-size:16px; font-variant-numeric:tabular-nums; }
.who { display:flex; gap:8px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
.who:last-child { border-bottom:0; }
.who .a { width:16px; flex:none; font-weight:700; } .who .a.in { color:var(--in); } .who .a.out { color:var(--out); } .who .a.dir { color:var(--teal); }
.who .v { font-weight:650; white-space:nowrap; font-variant-numeric:tabular-nums; }
.wk { cursor:pointer; }
.wk .t { font-weight:650; }
.curve { width:100%; height:130px; display:block; }
.sheet-bg { position:fixed; inset:0; background:var(--back); z-index:20; display:flex; align-items:flex-end; }
.sheet { background:var(--card); width:100%; max-width:720px; margin:0 auto; border-radius:18px 18px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:92vh; overflow:auto; -webkit-overflow-scrolling:touch; }
.sheet h3 { margin:0 0 4px; font-size:19px; }
label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
input,textarea { width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--cell); color:var(--ink); font-family:inherit; }
.seg { display:flex; background:var(--soft); border-radius:12px; padding:3px; }
.seg button { flex:1; border:0; background:none; padding:10px 0; border-radius:10px; font-size:15px; color:var(--ink); font-family:inherit; }
.seg button.on { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.18); font-weight:650; }
.seg.small button { padding:7px 0; font-size:14px; }
.btn { width:100%; border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:650; background:var(--primary); color:var(--on-primary); margin-top:18px; font-family:inherit; }
.btn:disabled { opacity:.5; }
.btn.light { background:var(--soft); color:var(--ink); margin-top:8px; }
.btns { display:flex; gap:8px; } .btns .btn { margin-top:8px; font-size:15px; padding:13px 8px; }
.center { text-align:center; padding:40px 20px; }
.pending { font-size:12px; color:var(--amber); }
.refused { font-size:12px; color:var(--out); }
.note { font-size:12px; color:var(--amber); margin-top:2px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 90px); background:#1c2430; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:30; max-width:90vw; box-shadow:0 2px 10px rgba(0,0,0,.3); }
.sheet-bg ~ .toast { bottom:auto; top:calc(env(safe-area-inset-top) + 12px); }   /* feuille ouverte : le message en haut, jamais sur « Enregistrer » */
.majapp { display:block; width:100%; border:0; background:var(--primary); color:var(--on-primary); font:inherit; font-size:14px; font-weight:650; padding:9px 12px; border-radius:12px; margin:0 0 10px; }
.vsc.calp { margin:0 4px; }
.calu { flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 11px; font:inherit; font-size:13.5px; white-space:nowrap; }
.bars .b { height:10px; border-radius:6px; background:var(--primary); }
.ph { font-size:12px; color:var(--teal); }
/* round 26 b (piste expomob, 07/10, juge à l'œil neuf : décisions A à G, identiques au PC) : onglet Exposition = un outil par question
   (titre-question, visuel, légende) ; explications dans les infobulles ⓘ et le glossaire ?, fermés par défaut. Un sens par couleur, dans les
   deux thèmes : vert = long / achat, rouge = short / vente, bleu (un seul) = swap, orange = non couvert, ardoise = prix fixe, violet = indexé,
   gris clair hachuré = sans prix ; bleu hachuré ▣ = verrouillé (swap déjà fixé) ; gain / perte = ▲ / ▼ avec signe, jamais une couleur.
   Carte de chaleur : 5 paliers par thème (--va1…5) et texte noir ou blanc selon le fond (--vt1…5 : contraste ≥ 4,5 calculé pour chaque palier). */
:root { --v-long:#1f7a4d; --v-short:#b3261e; --v-swap:#2563c9; --v-nc:#c25e00; --v-fixe:#334155; --v-idx:#7c3aed; --v-nv:#7d8794;
        --v-long-rgb:31,122,77; --v-short-rgb:179,38,30; --v-swap-rgb:37,99,201; --v-long-t:#16603b; --v-short-t:#9c1f18; --v-nc-t:#8a4300; --v-swap-t:#1d4fa3;
        --va1:.12; --va2:.28; --va3:.46; --va4:.66; --va5:1; --vt1:#000; --vt2:#000; --vt3:#000; --vt4:#000; --vt5:#fff; }
:root[data-theme="dark"] { --v-long:#5fc28f; --v-short:#f28b82; --v-swap:#7fb0ff; --v-nc:#f0a04b; --v-fixe:#94a3b8; --v-idx:#b794f6; --v-nv:#6b7686;
        --v-long-rgb:95,194,143; --v-short-rgb:242,139,130; --v-swap-rgb:127,176,255; --v-long-t:#7fd6a8; --v-short-t:#f6a39b; --v-nc-t:#f0b45a; --v-swap-t:#9cc2ff;
        --va1:.20; --va2:.38; --va3:.56; --va4:.76; --va5:.95; --vt1:#fff; --vt2:#fff; --vt3:#fff; --vt4:#000; --vt5:#000; }
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] { --v-long:#5fc28f; --v-short:#f28b82; --v-swap:#7fb0ff; --v-nc:#f0a04b; --v-fixe:#94a3b8; --v-idx:#b794f6; --v-nv:#6b7686;
        --v-long-rgb:95,194,143; --v-short-rgb:242,139,130; --v-swap-rgb:127,176,255; --v-long-t:#7fd6a8; --v-short-t:#f6a39b; --v-nc-t:#f0b45a; --v-swap-t:#9cc2ff;
        --va1:.20; --va2:.38; --va3:.56; --va4:.76; --va5:.95; --vt1:#fff; --vt2:#fff; --vt3:#fff; --vt4:#000; --vt5:#000; }
}
.vdefs { position:absolute; width:0; height:0; overflow:hidden; }
.vdefs .pk0 { fill:rgba(var(--v-swap-rgb), .30); } .vdefs .pk1 { fill:var(--v-swap); } .vdefs .pn1 { fill:var(--v-nv); }
.vtop { display:flex; align-items:center; gap:8px; margin:0 0 4px; }
.vtop .vsc { flex:1; min-width:0; }
.vq { flex:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--primary); font-size:17px; font-weight:800; font-family:inherit; padding:0; }
.vq.on { background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
.vgloss { font-size:13.5px; line-height:1.35; } .vgloss div { padding:5px 0; border-bottom:1px solid var(--line); } .vgloss div:last-child { border-bottom:0; } .vgloss b { font-weight:750; }
/* rangées qui défilent de côté (produits, mois, carte) : fondu et flèche tant qu'il reste à voir ; jamais une puce coupée net */
.vsc { position:relative; min-width:0; }
.vsc-in { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; scroll-snap-type:x proximity; position:relative; }
.vsc-in::-webkit-scrollbar { display:none; }
.vsc-in.chips > button { scroll-snap-align:start; }
.vsc.more .vsc-in { -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 84px), transparent calc(100% - 30px)); mask-image:linear-gradient(to right, #000 calc(100% - 84px), transparent calc(100% - 30px)); }
.vsc.less:not(.nl) .vsc-in { -webkit-mask-image:linear-gradient(to right, transparent, #000 22px); mask-image:linear-gradient(to right, transparent, #000 22px); }
.vsc.less.more:not(.nl) .vsc-in { -webkit-mask-image:linear-gradient(to right, transparent, #000 22px, #000 calc(100% - 84px), transparent calc(100% - 30px)); mask-image:linear-gradient(to right, transparent, #000 22px, #000 calc(100% - 84px), transparent calc(100% - 30px)); }
.vsc-arr { display:none; position:absolute; right:0; top:50%; margin-top:-15px; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:19px; font-weight:700; line-height:26px; padding:0; box-shadow:0 1px 4px var(--shadow); font-family:inherit; z-index:3; }
.vsc.chipsw .vsc-arr { margin-top:-19px; }
.vsc.more .vsc-arr { display:block; }
.vsc.vmapw .vsc-arr { top:0; margin-top:0; }
.vsc.vmapw .vsc-in { scroll-snap-type:x mandatory; scroll-padding-left:100px; } .vmap .vmh { scroll-snap-align:start; }   /* carte défilée : arrêt sur une colonne entière (largeur des colonnes ajustée à l'écran par vScrollInit : un nombre entier de mois visibles, fin du défilement sur une colonne), jamais une case à moitié */
.vsc.vmapw.more .vsc-in { -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 22px), transparent); mask-image:linear-gradient(to right, #000 calc(100% - 22px), transparent); }   /* carte : flèche sur la rangée des mois, jamais sur un chiffre */
.vunit { display:flex; justify-content:flex-end; margin:0 0 6px; }
.xu { width:104px; flex:none; } .xu button { padding:6px 0; font-size:13.5px; }
.xprods button { white-space:nowrap; padding:7px 11px; font-size:14px; }
.vmois button { padding:6px 11px; font-size:13.5px; }
/* A · tuile « Position aujourd'hui » : gros chiffre et barre en deux segments (bouge avec le prix / verrouillé ▣) */
.vtile { display:block; width:100%; background:var(--card); border-radius:14px; padding:11px 14px 12px; box-shadow:0 1px 2px var(--shadow); border:0; text-align:left; font-family:inherit; color:var(--ink); margin-bottom:10px; cursor:pointer; }

.vst .lk, .vsw.lk { background:repeating-linear-gradient(135deg, var(--v-swap) 0 3px, rgba(var(--v-swap-rgb), .30) 3px 6px); }

.vstl .z { color:var(--muted); } .v-lock { color:var(--v-swap-t); }
.vbarw { font-size:13px; font-weight:400; letter-spacing:0; margin-top:8px; }
.vtag { display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.04em; padding:2px 7px; border-radius:6px; background:var(--soft); color:var(--muted); white-space:nowrap; vertical-align:middle; }
.vtag.long { background:rgba(var(--v-long-rgb), .14); color:var(--v-long-t); } .vtag.short { background:rgba(var(--v-short-rgb), .14); color:var(--v-short-t); }
.v-long { color:var(--v-long); } .v-short { color:var(--v-short); } .v-swap { color:var(--v-swap); } .v-nv { color:var(--muted); }
.vo { padding:12px 12px 12px; }
.vo, .vtile { scroll-margin-top:calc(env(safe-area-inset-top) + 70px); }   /* outil amené à l'écran : jamais sous l'en-tête fixe */
.vo.flash { animation:vflash 1.4s ease-out 1; }

/* ================= Mobile v124 · style Bloomberg (thème Bloomberg d'Atlas : Theme41, Theme47, Chrome48) =================
   Fond noir ; libellés et titres en ambre, données en blanc, chiffres en chasse fixe ; barre rouge des fonctions (titre de la page) ; onglets ardoise
   à texte clair, l'onglet choisi en bleu à texte blanc ; boutons gris à texte blanc, action principale bleue ; champ modifiable = pavé ambre à texte
   noir ; angles droits, aucune ombre de décor ; achat / entrée en vert, vente / sortie en rouge. Un seul thème (le réglage Apparence est retiré). */
html:root, html:root[data-theme] {
  --bg:#000; --card:#0a0a0a; --ink:#e6e6e6; --muted:#b0b0b0; --line:#2c343e; --primary:#2b7bd4; --on-primary:#fff; --head:#000; --soft:#161616;
  --cell:#0a0a0a; --nav:#000; --shadow:transparent; --in:#36c24a; --in-t:#0d2a12; --out:#ff3b4a; --out-t:#3a0d12; --amber:#f0a21e; --amber-t:#2a1c05;
  --teal:#9fe0f2; --teal-t:#0f2a30; --back:rgba(0,0,0,.74); color-scheme:dark; --fix:#5aa0ff; --fix-t:#0e1f38; --idx:#f0a21e; --idx-t:#2a1c05;
  --sw:#b79cff; --sw-t:#221a38; --stk0:#6e747c; --gl:#0d2a12; --gc:#3a0d12;
  --v-long:#36c24a; --v-short:#ff3b4a; --v-swap:#5aa0ff; --v-nc:#f0a21e; --v-fixe:#b8b8b8; --v-idx:#b79cff; --v-nv:#6e747c;
  --v-long-rgb:54,194,74; --v-short-rgb:255,59,74; --v-swap-rgb:90,160,255; --v-long-t:#6fdc7f; --v-short-t:#ff7a85; --v-nc-t:#ffc940; --v-swap-t:#9cc2ff;
  --va1:.20; --va2:.38; --va3:.56; --va4:.76; --va5:.95; --vt1:#fff; --vt2:#fff; --vt3:#fff; --vt4:#000; --vt5:#000;
  --radius:0; --bar:#8c141a; --bar-hot:#a81c23; --bar-line:#c9474d; --tab:#383b42; --tab-ink:#f2f2f2; --tab-on:#1565a8; --key:#1f5fbf;
  --btn:#2e2e2e; --btn-line:#6e6e6e; --field:#ffa018; --field-ink:#000; --dim:#8a8a8a; --white:#f5f5f5; --gut:14px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html,body { background:#000; color:var(--ink); font-family:-apple-system,"Helvetica Neue",Arial,"Segoe UI",Roboto,sans-serif; }
*, *::before, *::after { border-radius:0 !important; }
body { font-size:15px; line-height:1.4; }
::selection { background:var(--tab-on); color:#fff; }
/* chiffres : chasse fixe, alignés */
.big, .q, .quantity, .v, .metrics b, .kv span:last-child, td, .position-number, .cash-row strong, .trend-row strong, .stock-now strong, .day .m,
.route-head strong, .route-destination strong, .attention-row>b, .expo-hero>strong, .vpl b, .mono, .num { font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:0; }
/* en-tête : marque ATLAS, langue, actualiser */
header { background:#000; color:var(--ink); border-bottom:1px solid var(--line); gap:8px; padding:calc(env(safe-area-inset-top) + 6px) var(--gut) 6px; min-height:52px; }
header .hl { min-width:0; }
header h1, header h1.brand { margin:0; font-size:15px; line-height:1.1; font-weight:700; letter-spacing:.14em; color:var(--amber); font-family:var(--mono); white-space:nowrap; overflow:hidden; }
header .sub { font-size:11px; color:var(--muted); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
header button { min-width:44px; min-height:40px; background:var(--btn); border:1px solid var(--btn-line); color:#fff; font-size:16px; padding:4px 8px; }
/* barre rouge des fonctions : titre de la page, sur toute la largeur */
main { padding-top:10px; }
.fbar, .reading-head { display:flex; align-items:center; gap:8px; justify-content:space-between; background:var(--bar); color:#fff; margin:-10px calc(-1 * var(--gut)) 12px;
  padding:6px var(--gut); min-height:40px; border:0; }
.fbar h2, .reading-head .page-title, .page-title { margin:0; font-size:14px !important; letter-spacing:.08em !important; text-transform:uppercase; font-weight:600; color:#fff; line-height:1.2; }
h2.page-title { color:var(--amber); }
.fbar h2, .reading-head h2.page-title { color:#fff; }
.fbar .fb-r { font:11px var(--mono); color:#fff; opacity:.92; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.reading-switch { border:0; gap:1px; }
.reading-switch button { color:#fff; min-height:36px; padding:4px 9px; font-size:12px; background:var(--bar); border:1px solid var(--bar); box-shadow:none !important; }
.reading-switch button[aria-pressed="true"] { background:var(--bar-hot); border-color:var(--bar-line); color:#fff; font-weight:600; }
/* titres de section : ambre, capitales */
h2, .section-heading h2, .section-heading h3, .cash-trend h2, .agenda-day h2 { color:var(--amber); text-transform:uppercase; letter-spacing:.06em; font-size:12px; font-weight:600; }
h3 { color:var(--amber); }
.sheet h3 { color:var(--amber); text-transform:uppercase; letter-spacing:.05em; font-size:15px; }
label { color:var(--amber); text-transform:uppercase; letter-spacing:.05em; font-size:11px; }
th, .detail-table th { color:var(--amber); text-transform:uppercase; letter-spacing:.04em; font-size:11px; font-weight:600; }
.muted, .status-text, .list-count, .section-heading>span, .trend-month, .op-heading>span:not(.status-text) { color:var(--muted); }
/* panneaux : noirs, filets fins, aucune ombre */
.card, .cal, .vtile, .vplage { background:var(--card); border:1px solid var(--line); box-shadow:none; }
.card { padding:12px; margin:0 0 10px; }
.card+.card { border-top:1px solid var(--line); }
.sheet { background:#050505; border-top:2px solid var(--amber); }
.sheet-close { background:var(--btn) !important; color:#fff; border:1px solid var(--btn-line) !important; }
.toast { background:#161616; color:#fff; border:1px solid var(--amber); box-shadow:none; }
/* onglets, segments, puces : ardoise ; choisi : bleu, texte blanc */
.seg { background:transparent; padding:0; gap:1px; }
.seg button { background:var(--tab); color:var(--tab-ink); border:0; min-height:40px; font-size:13px; box-shadow:none !important; }
.seg button.on { background:var(--tab-on); color:#fff; font-weight:600; box-shadow:none !important; border:0; }
.chips button, .workspace-tabs button { background:var(--tab); color:var(--tab-ink); border:0; box-shadow:none !important; font-size:13px; }
.chips button.on, .workspace-tabs button.on { background:var(--tab-on); color:#fff; border:0; }
.chips { gap:1px; }
.chip { background:var(--soft); color:var(--ink); }
.chip.late { background:var(--amber-t); color:var(--amber); }
/* boutons : gris à texte blanc ; action principale bleue */
.btn { background:var(--key); color:#fff; border:1px solid var(--key); font-size:15px; font-weight:600; letter-spacing:.02em; }
.btn.light, .text-action, .calhead button, .calu { background:var(--btn); color:#fff; border:1px solid var(--btn-line); }
.text-action { min-height:40px; padding:8px 12px; font:inherit; font-size:13px; }
.majapp { background:var(--key); color:#fff; }
/* champs modifiables : pavé ambre, texte noir (lecture seule : sombre) */
input:not([type=checkbox]):not([type=radio]):not([readonly]), select, .fold select, select#uiLanguage, .unit-select, .product-select select, .vpsel select {
  background:var(--field) !important; color:var(--field-ink) !important; border:1px solid var(--field) !important; font-family:inherit; }
input::placeholder { color:#5c3a00; }
textarea[readonly], input[readonly] { background:var(--soft); color:var(--ink); border:1px solid var(--line); }
textarea:not([readonly]) { background:var(--soft); color:var(--ink); border:1px solid var(--field); }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
/* barre des onglets du bas : ardoise, l'onglet choisi bleu */
nav { background:#000; border-top:1px solid var(--line); gap:1px; }
nav button { background:var(--tab); color:var(--tab-ink); font-size:10.5px; letter-spacing:.02em; min-height:56px; gap:3px; box-shadow:none !important; padding:6px 0 5px; }
nav button.on { background:var(--tab-on); color:#fff; font-weight:600; box-shadow:none !important; }
nav button svg { width:21px; height:21px; }
/* calendrier */
.cal { padding:8px 4px; }
.day { background:#0f0f0f; color:var(--ink); }
.day.today .n { background:var(--amber); color:#000; }
.day.sel { outline:2px solid var(--amber); }
.day .m.late { box-shadow:none; outline:1px solid var(--amber); outline-offset:-1px; }
.wband { background:#111; }
/* sens : achat / entrée vert, vente / sortie rouge */
.neg { color:var(--out); } .pos { color:var(--in); } .warn { color:var(--amber); }
.note, .pending { color:var(--amber); } .refused { color:var(--out); }
.op { border-bottom:1px solid var(--line); }
.op.in .op-heading>b, .hm-op.in .hm-d { color:var(--in); } .op.out .op-heading>b, .hm-op.out .hm-d { color:var(--out); }
.cash-focus .big { color:var(--white); font-size:32px; letter-spacing:0; }
.cash-focus .big.neg { color:var(--out); }
.cash-row { background:transparent; color:var(--ink); border-bottom:1px solid var(--line); }
.curve path { stroke:var(--amber); }
.version { color:var(--dim); font-family:var(--mono); }
.fold>summary { color:var(--amber); text-transform:uppercase; letter-spacing:.05em; font-size:12px; }
@media (max-width:360px) { html:root, html:root[data-theme] { --gut:10px; } }

/* ---------- écran Jour ---------- */
.hm-tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; width:100%; padding:0; border:1px solid var(--line); background:var(--line); margin:0 0 12px; font:inherit; color:inherit; text-align:left; cursor:pointer; }
.hm-tile { background:var(--card); padding:8px 6px 7px; min-width:0; }
.hm-tile small { display:block; color:var(--amber); font-size:10px; letter-spacing:.04em; text-transform:uppercase; line-height:1.15; min-height:23px; overflow-wrap:anywhere; }
.hm-tile b { display:block; font:600 22px/1.1 var(--mono); color:var(--white); margin-top:3px; }
.hm-tile b.neg { color:var(--out); } .hm-tile b.warn { color:var(--amber); } .hm-tile b.zero { color:var(--dim); }
.hm-blk { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); color:var(--ink); font:inherit; padding:10px 12px; margin:0 0 12px; cursor:pointer; }
.hm-h { display:flex; justify-content:space-between; gap:8px; align-items:baseline; color:var(--amber); font-size:11px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:4px; }
.hm-h span:last-child { color:var(--muted); letter-spacing:0; text-transform:none; font-family:var(--mono); }
.hm-big { font:600 26px/1.15 var(--mono); color:var(--white); }
.hm-big.neg { color:var(--out); }
.hm-kv { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:3px 0; border-top:1px solid #15191e; }
.hm-kv span:first-child { color:var(--muted); } .hm-kv b { font-family:var(--mono); font-weight:500; text-align:right; }
.hm-list { border:1px solid var(--line); margin:0 0 12px; }
.hm-list .hm-h { padding:8px 12px 4px; margin:0; background:var(--card); }
.hm-op, .mk-row { display:grid; grid-template-columns:44px 14px minmax(0,1fr) auto; gap:6px; align-items:baseline; width:100%; min-height:44px; padding:8px 12px; border:0; border-top:1px solid #15191e;
  background:#000; color:var(--ink); font:inherit; font-size:13px; text-align:left; cursor:pointer; }
.hm-op .hm-d { font-family:var(--mono); font-size:12px; color:var(--muted); }
.hm-op .hm-a { font-weight:700; } .hm-op.in .hm-a { color:var(--in); } .hm-op.out .hm-a { color:var(--out); }
.hm-op .hm-w { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hm-op .hm-q { font-family:var(--mono); text-align:right; white-space:nowrap; }
.hm-op.late .hm-d { color:var(--amber); }
.hm-more { display:block; width:100%; padding:10px 12px; border:0; border-top:1px solid #15191e; background:var(--card); color:var(--amber); font:inherit; font-size:12px; text-align:right; letter-spacing:.04em; cursor:pointer; min-height:40px; }
.hm-empty { padding:10px 12px; color:var(--muted); font-size:13px; border-top:1px solid #15191e; }

/* ---------- Marchés : moniteur et courbes ---------- */
.mk-seg { margin:0 0 8px; }
.mk-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; margin:2px 0 6px; }
.mk-head .mk-name { flex:1 1 100%; color:var(--amber); font-size:12px; letter-spacing:.05em; text-transform:uppercase; }
.mk-head .mk-last { font:600 26px/1.1 var(--mono); color:var(--white); }
.mk-head .mk-last small { font-size:12px; color:var(--muted); font-weight:400; margin-left:4px; }
.mk-head .mk-chg { font:13px var(--mono); }
.mk-head .mk-meta { flex:1 1 100%; font:11.5px var(--mono); color:var(--muted); }
.mk-per { display:flex; gap:1px; margin:6px 0 4px; }
.mk-per button { flex:1; min-height:40px; background:var(--tab); color:var(--tab-ink); border:0; font:600 12px var(--mono); letter-spacing:.04em; }
.mk-per button.on { background:var(--tab-on); color:#fff; }
.mk-chart { position:relative; width:100%; height:236px; background:#000; border:1px solid var(--line); touch-action:pan-y; user-select:none; -webkit-user-select:none; overflow:hidden; }
.mk-chart svg { display:block; width:100%; height:100%; }
.mk-chart .mk-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; color:var(--muted); font-size:13px; }
.mk-read { min-height:18px; font:11.5px/1.5 var(--mono); color:var(--white); margin:4px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mk-leg { margin:6px 0 10px; border-top:1px solid var(--line); }
.mk-leg div { display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:6px; align-items:baseline; padding:5px 0; border-bottom:1px solid #15191e; font-size:12.5px; }
.mk-leg i { display:inline-block; width:12px; height:3px; transform:translateY(-3px); }
.mk-leg i.dash { background:none !important; border-top:3px dashed currentColor; height:0; }
.mk-leg i.dot { background:none !important; border-top:3px dotted currentColor; height:0; }
.mk-leg span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mk-leg b { font:500 12.5px var(--mono); text-align:right; white-space:nowrap; }
.mk-leg small { display:block; color:var(--muted); font:11px var(--mono); white-space:normal; }
.mk-list { border:1px solid var(--line); margin:10px 0 12px; }
.mk-list .hm-h { padding:8px 12px 4px; margin:0; background:var(--card); }
.mk-row { grid-template-columns:minmax(0,1fr) auto 62px; gap:8px; }
.mk-row.on { background:#0b2342; }
.mk-row .mk-n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mk-row .mk-n small { display:block; color:var(--muted); font:11px var(--mono); }
.mk-row .mk-v { font-family:var(--mono); text-align:right; white-space:nowrap; color:var(--white); }
.mk-row .mk-c { font-family:var(--mono); text-align:right; white-space:nowrap; font-size:12px; }
.mk-tab { width:100%; border:1px solid var(--line); margin:0 0 12px; font-size:12.5px; }
.mk-tab th { text-align:right; background:var(--card); padding:7px 8px; }
.mk-tab th:first-child, .mk-tab td:first-child { text-align:left; }
.mk-tab td { padding:7px 8px; border-bottom:1px solid #15191e; font-size:12.5px; }
.mk-tab td:first-child { font-family:inherit; white-space:normal; }
.mk-src { font-size:11px; color:var(--muted); margin:0 0 14px; font-family:var(--mono); line-height:1.5; }
.mk-msg { padding:10px 12px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:13px; margin:0 0 12px; }
.mk-msg.err { color:var(--out); border-color:var(--out); }
.mk-msg button { margin-top:8px; }
/* mobile v131 · round 88 (CASH-EXPO) : couvert / non couvert, camions par mois de prix, trésorerie datée */
.c88sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 6px}.c88sum div{background:var(--card);border:1px solid var(--line);padding:6px 7px;min-width:0}.c88sum small{display:block;color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.c88sum b{display:block;font-family:var(--mono);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c88sum span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c88b{color:var(--v-swap)!important}.c88o{color:var(--v-nc)!important}.c88px{font-size:11px;margin-bottom:6px;overflow-wrap:anywhere}
.c88leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-bottom:6px}.c88leg i{display:inline-block;width:10px;height:8px;margin-right:4px;vertical-align:middle}.c88leg .ad{background:var(--v-nv)}.c88leg .cv{background:var(--v-swap)}.c88leg .nc{background:var(--v-nc)}.c88leg .ix{border:1.5px solid var(--v-idx)}.c88leg .sw{background:var(--v-swap-t,#9cc2ff);height:6px}
.c88head{display:grid;grid-template-columns:52px 1fr 1fr;font-size:11px;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:3px}.c88head span:last-child{text-align:right}
.c88row{display:grid;grid-template-columns:52px 1fr 1fr;align-items:end;border-bottom:1px solid var(--line);padding:5px 0 4px;column-gap:4px}.c88row.done{opacity:.62}
.c88m{grid-row:1/span 3;align-self:stretch;border:0;background:none;color:var(--white);font:600 12px var(--mono);text-align:left;padding:0}
.c88side{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;min-width:0}.c88side.r{justify-content:flex-end}
.c88t{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;color:var(--muted);min-height:0}.c88t small{font:10px var(--mono);color:var(--muted)}.c88stk{font:11px var(--mono);color:var(--v-long);border:1px solid var(--v-long);padding:1px 4px}
.c88bar{grid-column:2/span 2;border:0;background:none;padding:3px 0 0;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--ink)}.c88track{display:flex;height:7px;background:var(--soft);width:100%}.c88track i{display:block;height:100%}.c88track .cv{background:var(--v-swap)}.c88track .nc{background:var(--v-nc)}.c88track .ov{background:repeating-linear-gradient(90deg,var(--v-swap) 0 3px,transparent 3px 6px)}.c88val{font:11px var(--mono);color:var(--muted)}
.c88sws{grid-column:2/span 2;display:flex;flex-wrap:wrap;gap:3px;padding-top:3px}.c88s{border:1px solid var(--v-swap);background:var(--fix-t,#0e1f38);color:var(--v-swap);font:10px var(--mono);padding:2px 5px;min-height:0}
/* round 103 css f */
/* round 103 : piste f · bouton OUTILS de l'en-tête et feuille des outils */
#btnOutils103f { font:600 12px var(--mono); letter-spacing:.06em; padding:4px 9px; }
#btnOutils103f[hidden] { display:none !important; }
#btnOutils103f.mq { background:var(--amber); border-color:var(--amber); color:#000; }
.ou103f-n { margin:2px 0 10px; }
.ou103f-t { border:1px solid var(--line); background:var(--card); margin:0 0 6px; }
.ou103f-t > summary { display:block; list-style:none; cursor:pointer; padding:9px 12px; min-height:44px; }
.ou103f-t > summary::-webkit-details-marker { display:none; }
.ou103f-t > summary b { display:block; color:var(--amber); font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; font-weight:600; }
.ou103f-t > summary span { display:block; color:var(--muted); font-size:12px; margin-top:2px; }

.ou103f-b { padding:6px 12px 12px; }

.ou103f-b select { width:100%; margin:6px 0 0; }
.ou103f-r { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; align-items:center; margin:6px 0; }
.ou103f-r select { width:auto; margin:0; }
.ou103f-r.c3 { grid-template-columns:minmax(0,1fr) auto auto; }
.ou103f-r3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin:6px 0; }
.ou103f-fx { grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); }
.ou103f-fx select { width:100%; }
.ou103f-sw { min-width:44px; min-height:40px; background:var(--btn); border:1px solid var(--btn-line); color:#fff; font-size:16px; }
.ou103f-u { font:600 14px var(--mono); color:var(--muted); padding:0 6px; }
.ou103f-l { display:block; color:var(--amber); font-size:11px; letter-spacing:.05em; text-transform:uppercase; margin:10px 0 2px; }
.ou103f-o { margin-top:6px; }
.ou103f-o .kv span:first-child { min-width:0; }
.ou103f-o .kv span:last-child { text-align:right; overflow-wrap:anywhere; }
.ou103f-hs { display:block; color:var(--muted); font-size:11px; font-family:inherit; }
.ou103f-big { font:600 20px/1.25 var(--mono); color:var(--white); margin:4px 0; overflow-wrap:anywhere; }
.ou103f-big.neg { color:var(--out); } .ou103f-big.warn { color:var(--amber); }
.ou103f-x { font-size:11.5px; color:var(--muted); margin:6px 0 0; line-height:1.4; }
.ou103f-x.neg { color:var(--out); } .ou103f-x.pos { color:var(--in); } .ou103f-x.warn { color:var(--amber); }
.ou103f-chips { display:flex; flex-wrap:wrap; gap:1px; margin:6px 0; }
.ou103f-chips button { background:var(--tab); color:var(--tab-ink); border:0; min-height:36px; min-width:44px; padding:4px 10px; font:12px var(--mono); }
.ou103f-b textarea { font:12px/1.4 var(--mono); width:100%; margin-top:6px; }
.ou103f-top { margin:0 0 8px; }
.ou103f-mq { width:100%; text-align:left; min-height:44px; padding:8px 12px; background:var(--btn); border:1px solid var(--btn-line); color:#fff; font:600 13px var(--mono); }
.ou103f-mq.on { background:var(--amber); border-color:var(--amber); color:#000; }
/* round 103 f : fin css */
/* round 103 : piste f · mode réunion : chiffres recouverts d'un pavé gris, étiquettes des courbes cachées (la feuille Outils jamais) */
.mq103f { color:transparent !important; background:var(--btn-line) !important; text-shadow:none !important; -webkit-user-select:none; user-select:none; }
body.mq103f-on #main svg text, body.mq103f-on .sheet:not(.ou103f-sh) svg text { visibility:hidden; }
/* round 103 css a */
nav button { position:relative; }
.nb103a { position:absolute; top:3px; left:calc(50% + 5px); min-width:16px; height:16px; padding:0 4px; background:var(--amber); color:#000; font:600 10px/16px var(--mono); font-style:normal; text-align:center; letter-spacing:0; }
.nb103a.neg { background:var(--out); color:#fff; }
header .sub.warn103a { color:var(--amber); }
.hm-old103a { border:1px solid var(--amber); background:var(--amber-t); padding:9px 12px; margin:0 0 12px; font-size:13px; line-height:1.4; }
.hm-old103a b { color:var(--amber); display:block; margin-bottom:2px; }
.hm-err103a { border:1px solid var(--out); background:var(--out-t); padding:9px 12px; margin:0 0 12px; font-size:13px; overflow-wrap:anywhere; }
.hm-err103a b { color:var(--out); display:block; margin-bottom:2px; }
.hm-note103a { font-size:12px; color:var(--amber); padding:1px 0 4px; line-height:1.35; }
.hm-more.hm-left103a { text-align:left; }
.hm-tot103a { background:#000; } .hm-tot103a .hm-kv { padding:5px 12px; }
.hm-op .hm-d small { display:block; font-size:10.5px; color:var(--amber); line-height:1.2; }
.hm-sub103a { padding:6px 12px 3px; border-top:1px solid #15191e; background:var(--card); color:var(--amber); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; }
/* round 103 css b */
.jn103b { display:flex; justify-content:space-between; gap:8px; margin:4px 0 8px; }
.jn103b button { min-height:40px; padding:6px 12px; background:var(--btn); color:#fff; border:1px solid var(--btn-line); font:12px var(--mono); }
.day .m.oth103b { background:var(--soft); color:var(--ink); }
.cpr103b .who { cursor:pointer; }
.cpr103b .v span { font-family:var(--mono); }
.ctf103b { margin:8px 0 2px; }
.ctf103b > summary { white-space:normal; overflow-wrap:anywhere; }
.ct103b { display:flex; gap:8px; align-items:baseline; width:100%; min-height:40px; padding:6px 0; border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink); font:inherit; font-size:13px; text-align:left; }
.ct103b > span:first-child { font-family:var(--mono); flex:0 0 auto; min-width:58px; }

.op .coh103b { font-size:12px; margin-top:3px; }

.out103b select { flex:0 0 auto; max-width:46%; }
.f103b { padding-bottom:6px; }
#mode.seg { margin:2px 0 10px; }
/* round 103 css c */
.bar103c i.f { opacity:.45; } .bar103c i.s { background:var(--amber); } .bar103c i.s.n { background:var(--out); opacity:.7; }
.pr103c.cur103c .row b.grow { color:var(--amber); }

.sl103c { display:block; font-size:11px; font-weight:400; color:var(--muted); }
.cash-row.vide103c { cursor:default; }

.g103c { display:flex; gap:8px; align-items:baseline; width:100%; padding:8px 0; border:0; border-bottom:1px solid var(--line); background:none; color:var(--ink); font:inherit; font-size:14px; text-align:left; }

.inc103c { display:block; width:100%; margin-top:8px; text-align:left; color:var(--amber) !important; }

.ec103c, .bes103c { margin-top:6px; font-size:13px; line-height:1.45; overflow-wrap:anywhere; }

.workspace-tabs.tv103c { grid-template-columns:1fr 1fr; }
.pr103c { padding:8px 0; border-bottom:1px solid var(--line); }

/* round 103 css d */
.mk-v small.f103d{display:block;font:10px var(--mono);color:var(--muted)}

/* round 103 (plein écran iPhone) : ouverte depuis l'écran d'accueil, l'app passe sous la barre d'état (« black-translucent ») et occupe tout
   l'écran. Les zones sûres de l'iPhone (env(safe-area-inset-*) : heure et île en haut, barre d'accueil en bas, encoche et coins arrondis sur les

async function mkRead(L, f, tail) {

function parseSerie(text, partial) {
  let ls0 = String(text || "").split(/\r?\n/); if (partial) ls0 = ls0.slice(1);
  const pts = []; let src = "";
  for (const l of ls0) {
    const c = l.split(";"); if (c.length < 2 || !/^\d{4}-\d{2}-\d{2}$/.test(c[0])) continue;
    const v = parseFloat(c[1]); if (!isFinite(v)) continue;
    if (pts.length && pts[pts.length - 1][0] === c[0]) pts.pop();
    pts.push([c[0], v]); src = c.slice(2).join(";").trim() || src;
  }
  pts.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  return { pts, src };
}

/* round 103 (piste e) · Stock › Compter : stock « vu » d'un lot = comptage envoyé pas encore repris (attente « lot|compte », hors entrée bloquée),
   sinon le stock de la fiche ; Atlas compare ce stock vu au stock du lot à la reprise : un 2e comptage partait de l'ancien stock et Atlas le
   refusait (« stock modifié depuis le comptage ») dès que le 1er était repris */
function vuLot103e(l) {
  const b = blocage(), p = pending[l.lot + "|compte"];
  return p && !(p.fichier && b.fichiers.has(p.fichier)) && p.valeur != null && isFinite(+p.valeur) ? +p.valeur : l.stock;
}
/* round 103 (piste e) · Stock : lots de la fiche rangés par lieu (lieu absent : « à compléter »), total de chaque produit dans le lieu ; recherche
   (lot, produit, lieu) dès 4 lots, qui ne redessine que la liste (le champ garde le clavier) */
let lotQ103e = "", lotRow103e = null;
function listeLots103e(inv) {
  const q = inv.length > 3 ? lotQ103e.trim().toLowerCase() : "", sel = q ? inv.filter(l => [l.lot, prod(l.produit), l.lieu].some(v => String(v || "").toLowerCase().includes(q))) : inv;
  if (!sel.length) return '<div class="card muted">' + t("noData") + '</div>';
  const by = new Map(); sel.forEach(l => { const k = String(l.lieu || "").trim(); if (!by.has(k)) by.set(k, []); by.get(k).push(l); });
  return Array.from(by.keys()).sort((a, b) => (a ? 0 : 1) - (b ? 0 : 1) || a.localeCompare(b)).map(k => {
    const xs = by.get(k), ps = Array.from(new Set(xs.map(l => l.produit)));
    return '<div class="lieu103e"><b>' + esc(k || ui("Lieu à compléter", "Location to complete")) + '</b><span>' +
      esc(ps.map(p => prod(p) + " " + qn(sommeLots103e(xs.filter(l => l.produit === p))) + " " + U()).join(" · ") + " · " + xs.length + " lot" + (xs.length > 1 ? "s" : "")) + '</span></div>' +
      xs.map(l => lotRow103e(l)).join("");
  }).join("");
}
function lotsGroupes103e(inv, row) {
  lotRow103e = row;   /* rend [html] : la liste de renderStock finit par .join("") */
  return ['<h2>' + esc(ui("Lots à compter", "Lots to count") + " (" + inv.length + ")") + '</h2>' +
    (inv.length > 3 ? '<input id="lotq103e" type="search" autocomplete="off" aria-label="' + esc(ui("Chercher un lot", "Search a lot")) + '" placeholder="' + esc(ui("Lot, produit, lieu", "Lot, product, location")) + '" value="' + esc(lotQ103e) + '" style="margin-bottom:8px">' : "") +
    '<div id="lots103e">' + listeLots103e(inv) + '</div>'];
}
function lierLots103e() {
  const i = $("#lotq103e"), L = $("#lots103e"); if (!i || !L) return;
  i.oninput = () => { lotQ103e = i.value; L.innerHTML = listeLots103e((data && data.inventaire) || []); L.querySelectorAll("[data-lot]").forEach(b => b.onclick = () => countLot(b.dataset.lot)); };
}
/* round 103 (piste e) · Stock : prochain manque d'un produit inventorié : première semaine, à partir de celle-ci, où le moteur d'Atlas voit un besoin
   (« besoin », « besoinLe » de la fiche, au-delà de la tolérance de pesée : besoinVu) ; sinon « aucun manque » jusqu'à la fin de la fiche */
function prochainManque103e(p) {
  const s = STK(); if (!s || !p.inventorie) return "";
  const lu = iso(lundi(parseD(today))), w = (p.semaines || []).find(x => x.du >= lu && besoinVu(x) && x.besoinLe);
  return w ? '<div class="note">' + esc(ui("Prochain manque : ", "Next shortfall: ") + tf("needOn", qn(w.besoin) + " " + U(), fmtDM(w.besoinLe)) + " (" + t("wk") + semNo(parseD(w.du)) + ")") + '</div>'
           : '<div class="muted">' + esc(ui("Aucun manque prévu jusqu'au ", "No shortfall planned until ") + fmtD(s.au)) + '</div>';
}
/* round 103 (piste e) · Stock : incohérences de la fiche signalées, jamais corrigées : stock réel négatif, position négative ce soir, lots d'un
   produit sans inventaire dans Atlas, total des lots différent du stock réel au-delà de la tolérance de pesée (1 lb, BESOIN_MIN) */
function stockAlertes103e(p, fin, lots) {
  const a = [], L = sommeLots103e(lots), u = v => qn(v) + " " + U();
  if (p.reel != null && p.reel <= -0.5) a.push(ui("stock réel négatif : sorties faites au-delà de l'inventaire", "negative actual stock: outflows done beyond the inventory"));
  if (fin != null && fin <= -0.5) a.push(ui("position négative ce soir : sorties prévues au-delà du stock", "negative position tonight: planned outflows beyond the stock"));
  if (!p.inventorie && lots.length) a.push(ui("lots en stock mais produit sans inventaire dans Atlas", "lots in stock but product without inventory in Atlas"));
  else if (p.inventorie && p.reel != null && (lots.length || p.reel > BESOIN_MIN) && Math.abs(L - p.reel) > BESOIN_MIN)
    a.push(ui("lots " + u(L) + " · stock réel " + u(p.reel) + " : écart " + u(Math.abs(L - p.reel)) + " à vérifier dans Atlas",
              "lots " + u(L) + " · actual stock " + u(p.reel) + ": gap " + u(Math.abs(L - p.reel)) + " to check in Atlas"));
  return a.map(x => '<div class="refused">⚠︎ ' + esc(x) + '</div>').join("");
}
/* round 103 (piste e) · Stock du jour : par produit, chiffres du moteur de la fiche (jamais recalculés) : réel = inventaire + livraisons faites
   (« reel »), fin de journée = position avec les prévues et les retards placés aujourd'hui (« fins », comme la feuille d'un jour du calendrier),
   entrées et sorties de la semaine en cours (« semaines ») ; total des lots de la fiche (« inventaire ») ; quantités seulement, aucun prix */
const lotsDe103e = pr => ((data && data.inventaire) || []).filter(l => l.produit === pr);
const sommeLots103e = xs => xs.reduce((a, l) => a + (+l.stock || 0), 0);
function stockJour103e() {
  const s = STK(); if (!s) return "";
  const lu = iso(lundi(parseD(today))), sn = t("wk") + semNo(parseD(today));
  const m = (lab, v, cls) => '<div><small>' + esc(lab) + '</small><b class="' + (cls || "") + '">' + v + '</b></div>';
  const rows = s.produits.map(p => {
    const w = semDe(p, lu), fin = finJour(p, today), lots = lotsDe103e(p.produit);
    if (p.reel == null && fin == null && !lots.length && !(w && (w.ent || w.sor))) return "";
    const inv = !!(p.inventorie && p.inventaire), age = inv ? Math.round((parseD(today) - parseD(p.inventaire)) / 864e5) : 0;
    return '<div class="card sj103e"><div class="row"><b class="grow">' + esc(prod(p.produit)) + '</b><span class="muted">' +
      esc(inv ? tf("invOf", fmtDM(p.inventaire)) + (age >= 0 ? " · " + ui(age + " j", age + " d") : "") : t("notInv")) + '</span></div><div class="metrics">' +
      m(ui("Réel · fait", "Actual · done"), p.reel == null ? "—" : qs(p.reel), p.reel != null && p.reel <= -0.5 ? "neg" : "") +
      m(ui("Fin de journée · prévu", "End of day · planned"), fin == null ? "—" : qs(fin), fin != null && fin <= -0.5 ? "neg" : "") +
      m(t("inW") + " " + sn, w && w.ent ? "+" + qn(w.ent) : "—", w && w.ent ? "pos" : "") + m(t("outW") + " " + sn, w && w.sor ? "−" + qn(w.sor) : "—", w && w.sor ? "neg" : "") + '</div>' +
      (lots.length ? '<div class="muted">' + esc(ui("Lots", "Lots") + " : " + qn(sommeLots103e(lots)) + " " + U() + " · " + lots.length + " lot" + (lots.length > 1 ? "s" : "")) + '</div>' : "") +
      stockAlertes103e(p, fin, lots) + prochainManque103e(p) + '</div>';
  }).join("");
  return rows ? '<h2>' + esc(ui("Stock du jour", "Today's stock")) + '</h2>' + rows : "";
}
if (!window.ATLAS_ESSAI) boot();
</script>
