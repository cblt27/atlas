/* round 25 (corrections) : quantité complète dans la case (plus de « k ») : flèche réduite, texte plus petit pour 6 chiffres et plus ; le nombre (insécable)

.day .m.late { box-shadow:inset 0 0 0 1px var(--amber); }

.wband b { color:var(--ink); font-weight:650; }

.op .q { font-weight:700; font-size:17px; white-space:nowrap; }

.who { display:flex; gap:8px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
.who:last-child { border-bottom:0; }
.who .a { width:16px; flex:none; font-weight:700; } .who .a.in { color:var(--in); } .who .a.out { color:var(--out); } .who .a.dir { color:var(--teal); }
.who .v { font-weight:650; white-space:nowrap; font-variant-numeric:tabular-nums; }
.wk { cursor:pointer; }
.wk .t { font-weight:650; }
.curve { width:100%; height:130px; display:block; }
.sheet-bg { position:fixed; inset:0; background:var(--back); z-index:20; display:flex; align-items:flex-end; }
.sheet { background:var(--card); width:100%; max-width:720px; margin:0 auto; border-radius:18px 18px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:92vh; overflow:auto; -webkit-overflow-scrolling:touch; }
.sheet h3 { margin:0 0 4px; font-size:19px; }
label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
input,textarea { width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--cell); color:var(--ink); font-family:inherit; }
.seg { display:flex; background:var(--soft); border-radius:12px; padding:3px; }

.btn { width:100%; border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:650; background:var(--primary); color:var(--on-primary); margin-top:18px; font-family:inherit; }
.btn:disabled { opacity:.5; }

.center { text-align:center; padding:40px 20px; }

.bars .b { height:10px; border-radius:6px; background:var(--primary); }
.ph { font-size:12px; color:var(--teal); }
/* round 26 b (piste expomob, 07/10, juge à l'œil neuf : décisions A à G, identiques au PC) : onglet Exposition = un outil par question
   (titre-question, visuel, légende) ; explications dans les infobulles ⓘ et le glossaire ?, fermés par défaut. Un sens par couleur, dans les
   deux thèmes : vert = long / achat, rouge = short / vente, bleu (un seul) = swap, orange = non couvert, ardoise = prix fixe, violet = indexé,
   gris clair hachuré = sans prix ; bleu hachuré 🔒 = verrouillé (swap déjà fixé) ; gain / perte = ▲ / ▼ avec signe, jamais une couleur.
   Carte de chaleur : 5 paliers par thème (--va1…5) et texte noir ou blanc selon le fond (--vt1…5 : contraste ≥ 4,5 calculé pour chaque palier). */
:root { --v-long:#1f7a4d; --v-short:#b3261e; --v-swap:#2563c9; --v-nc:#c25e00; --v-fixe:#334155; --v-idx:#7c3aed; --v-nv:#7d8794;
        --v-long-rgb:31,122,77; --v-short-rgb:179,38,30; --v-swap-rgb:37,99,201; --v-long-t:#16603b; --v-short-t:#9c1f18; --v-nc-t:#8a4300; --v-swap-t:#1d4fa3;
        --va1:.12; --va2:.28; --va3:.46; --va4:.66; --va5:1; --vt1:#000; --vt2:#000; --vt3:#000; --vt4:#000; --vt5:#fff; }
:root[data-theme="dark"] { --v-long:#5fc28f; --v-short:#f28b82; --v-swap:#7fb0ff; --v-nc:#f0a04b; --v-fixe:#94a3b8; --v-idx:#b794f6; --v-nv:#6b7686;
        --v-long-rgb:95,194,143; --v-short-rgb:242,139,130; --v-swap-rgb:127,176,255; --v-long-t:#7fd6a8; --v-short-t:#f6a39b; --v-nc-t:#f0b45a; --v-swap-t:#9cc2ff;
        --va1:.20; --va2:.38; --va3:.56; --va4:.76; --va5:.95; --vt1:#fff; --vt2:#fff; --vt3:#fff; --vt4:#000; --vt5:#000; }
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] { --v-long:#5fc28f; --v-short:#f28b82; --v-swap:#7fb0ff; --v-nc:#f0a04b; --v-fixe:#94a3b8; --v-idx:#b794f6; --v-nv:#6b7686;
        --v-long-rgb:95,194,143; --v-short-rgb:242,139,130; --v-swap-rgb:127,176,255; --v-long-t:#7fd6a8; --v-short-t:#f6a39b; --v-nc-t:#f0b45a; --v-swap-t:#9cc2ff;
        --va1:.20; --va2:.38; --va3:.56; --va4:.76; --va5:.95; --vt1:#fff; --vt2:#fff; --vt3:#fff; --vt4:#000; --vt5:#000; }
}
.vdefs { position:absolute; width:0; height:0; overflow:hidden; }
.vdefs .pk0 { fill:rgba(var(--v-swap-rgb), .30); } .vdefs .pk1 { fill:var(--v-swap); } .vdefs .pn1 { fill:var(--v-nv); }
.vtop { display:flex; align-items:center; gap:8px; margin:0 0 4px; }
.vtop .vsc { flex:1; min-width:0; }
.vq { flex:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--primary); font-size:17px; font-weight:800; font-family:inherit; padding:0; }
.vq.on { background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
.vgloss { font-size:13.5px; line-height:1.35; } .vgloss div { padding:5px 0; border-bottom:1px solid var(--line); } .vgloss div:last-child { border-bottom:0; } .vgloss b { font-weight:750; }
/* rangées qui défilent de côté (produits, mois, carte) : fondu et flèche tant qu'il reste à voir ; jamais une puce coupée net */
.vsc { position:relative; min-width:0; }
.vsc-in { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; scroll-snap-type:x proximity; position:relative; }
.vsc-in::-webkit-scrollbar { display:none; }
.vsc-in.chips > button { scroll-snap-align:start; }
.vsc.more .vsc-in { -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 84px), transparent calc(100% - 30px)); mask-image:linear-gradient(to right, #000 calc(100% - 84px), transparent calc(100% - 30px)); }
.vsc.less:not(.nl) .vsc-in { -webkit-mask-image:linear-gradient(to right, transparent, #000 22px); mask-image:linear-gradient(to right, transparent, #000 22px); }
.vsc.less.more:not(.nl) .vsc-in { -webkit-mask-image:linear-gradient(to right, transparent, #000 22px, #000 calc(100% - 84px), transparent calc(100% - 30px)); mask-image:linear-gradient(to right, transparent, #000 22px, #000 calc(100% - 84px), transparent calc(100% - 30px)); }
.vsc-arr { display:none; position:absolute; right:0; top:50%; margin-top:-15px; width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:19px; font-weight:700; line-height:26px; padding:0; box-shadow:0 1px 4px var(--shadow); font-family:inherit; z-index:3; }
.vsc.chipsw .vsc-arr { margin-top:-19px; }
.vsc.more .vsc-arr { display:block; }
.vsc.vmapw .vsc-arr { top:0; margin-top:0; }
.vsc.vmapw .vsc-in { scroll-snap-type:x mandatory; scroll-padding-left:100px; } .vmap .vmh { scroll-snap-align:start; }   /* carte défilée : arrêt sur une colonne entière (largeur des colonnes ajustée à l'écran par vScrollInit : un nombre entier de mois visibles, fin du défilement sur une colonne), jamais une case à moitié */
.vsc.vmapw.more .vsc-in { -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 22px), transparent); mask-image:linear-gradient(to right, #000 calc(100% - 22px), transparent); }   /* carte : flèche sur la rangée des mois, jamais sur un chiffre */
.vunit { display:flex; justify-content:flex-end; margin:0 0 6px; }
.xu { width:104px; flex:none; } .xu button { padding:6px 0; font-size:13.5px; }
.xprods button { white-space:nowrap; padding:7px 11px; font-size:14px; }
.vmois button { padding:6px 11px; font-size:13.5px; }
/* A · tuile « Position aujourd'hui » : gros chiffre et barre en deux segments (bouge avec le prix / verrouillé 🔒) */

.vtag.long { background:rgba(var(--v-long-rgb), .14); color:var(--v-long-t); } .vtag.short { background:rgba(var(--v-short-rgb), .14); color:var(--v-short-t); }
.v-long { color:var(--v-long); } .v-short { color:var(--v-short); } .v-swap { color:var(--v-swap); } .v-nv { color:var(--muted); }

// mémoire des photos à envoyer : la photo réduite (JPEG en base 64) est gardée dans la mémoire du téléphone, dans l'espace du compte, à côté de
// la boîte d'envoi (clé « u.<compte>.photo.<nom du fichier de la modification> ») ; retirée après l'envoi ou l'abandon ; mémoire pleine : dit,
// rien n'est gardé (quelques dizaines de photos réduites tiennent)
const PHOTO_MAX = 40 * 1024 * 1024, PHOTO_COTE = 1600;
const octets = b => b.arrayBuffer ? b.arrayBuffer() : new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsArrayBuffer(b); });
const enB64 = buf => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const deB64 = s => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const photoMem = { cle: name => kU(moi(), "photo." + name), get: cle => ls.get(cle, null), put: (cle, b64) => ls.set(cle, b64) && ls.get(cle, null) === b64, del: cle => ls.del(cle) };
// réduction sur le téléphone : côté long 1 600 px au plus, JPEG (données de localisation retirées : nouvelle image) ; refus : pas une image, trop grosse
async function reduire(file) {
  const err = (cle, arg) => Object.assign(new Error(cle), { cle, arg });
  if (!file || !(/^image\//.test(file.type || "") || (!file.type && /\.(jpe?g|png|heic|heif|gif|webp)$/i.test(file.name || "")))) throw err("notImage");
  if (file.size > PHOTO_MAX) throw err("tooBig", nf(file.size / 1048576, 1));
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((ok, ko) => { img.onload = ok; img.onerror = () => ko(err("notImage")); img.src = url; });
    const w0 = img.naturalWidth, h0 = img.naturalHeight; if (!w0 || !h0) throw err("notImage");
    const k = Math.min(1, PHOTO_COTE / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85)); if (!blob) throw err("photoErr");
    return { blob, l: w, h };
  } finally { URL.revokeObjectURL(url); }
}
// appareil photo (capture) ou galerie : champ fichier caché, placé dans la page le temps du choix (iPhone)
function choisirPhoto(ref, camera, apres) {
  if (ligneBloquee(ref)) return;
  if (!photoOk()) { toast("⚠ " + t("noPhotoAtlas")); return; }
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; if (camera) i.setAttribute("capture", "environment");
  i.style.display = "none"; document.body.appendChild(i);
  i.onchange = async () => { const f = i.files && i.files[0]; i.remove(); if (f) { await ajouterPhoto(ref, f); if (apres) apres(); } };
  i.click();
}
// photo d'une livraison : réduite, gardée sur le téléphone (photoMem) avec sa modification dans la boîte d'envoi, puis envoyée (photo d'abord,
// dans « photos », puis la modification qui la cite, dans « modifs ») ; hors réseau : envoyée au retour du réseau, comme les autres saisies
async function ajouterPhoto(ref, file) {
  if (ligneBloquee(ref)) return false;
  if (!data || (!DEMO && (!place || !account || !moi()))) { toast("⚠ " + t("noSheet")); return false; }
  if (!(data.livraisons || []).some(x => x.ref === ref)) { toast("⚠ " + t("noDeliv")); return false; }
  if (!photoOk()) { toast("⚠ " + t("noPhotoAtlas")); return false; }   // rien de gardé ni d'envoyé
  let r; try { r = await reduire(file); } catch (e) { toast("⚠ " + (e && e.cle ? tf(e.cle, e.arg || "") : t("photoErr"))); return false; }
  if (DEMO) { toast(t("demoSent")); return true; }
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "");
  const fichier = String(ref).replace(/[^A-Za-z0-9_\-]/g, "_") + "_" + stamp + "_" + Math.random().toString(36).slice(2, 8) + ".jpg";
  const name = newName(), cle = photoMem.cle(name);
  let ok = false; try { ok = photoMem.put(cle, enB64(await octets(r.blob))); } catch (e) { ok = false; }
  if (!ok) { photoMem.del(cle); toast("⚠ " + t("photoNotKept")); return false; }
  const etat = { gardee: false };
  try { await send([{ t: "photo", ref, champ: "photo", valeur: fichier, octets: r.blob.size, largeur: r.l, hauteur: r.h }], name, etat, { fichier, cle }); }
  catch (e) { if (!etat.gardee) { photoMem.del(cle); toast("⚠ " + (e && e.message)); return false; } }
  toast(envoyees.has(name) ? t("photoSent") : bloquees(us.get("outbox", [])).has(name) ? t("blocked") : t("photoKept"));
  if (!document.querySelector(".sheet-bg")) render();
  return true;
}

  sheet('<h3>' + esc(prod(l.produit)) + '</h3><div class="muted">' + esc(l.lot) + " · " + nf(l.stock) + ' lb</div><label>' + t("counted") + '</label><input id="q" type="number" inputmode="decimal">' +
    '<label>' + t("countDate") + '</label><input id="d" type="date" value="' + todayIso() + '"><label>' + t("comment") + '</label><textarea id="m" rows="2"></textarea><button class="btn" id="ok">' + t("save") + '</button><button class="btn light" id="ko">' + t("cancel") + '</button>', (bg, close) => {
      bg.querySelector("#ko").onclick = close;
      bg.querySelector("#ok").onclick = async () => {
        const q = parseFloat(bg.querySelector("#q").value), d = bg.querySelector("#d").value, m = bg.querySelector("#m").value.trim(), ch = [];
        // stock affiché au moment du comptage : Atlas refuse le comptage si le stock a bougé depuis (mouvement saisi entre-temps)
        if (!isNaN(q) && q >= 0) ch.push({ t: "inventaire", ref: lot, champ: "compte", valeur: q, date: d, stockVu: l.stock });
        if (m) ch.push({ t: "inventaire", ref: lot, champ: "commentaire", valeur: m });
        if (!ch.length) { close(); return; }
        await submit(bg, close, ch, name);
      };
    });
}
const phLigne = l => "📷 " + tf("photoN", l.photos || 0) + (l.photosAttente ? " · " + tf("photoWait", l.photosAttente) : "");
function render() {
  today = todayIso();
  header(); if (!data) { if (sansFiche) sansFiche(); return; } tabs();
  ({ cal: renderCal, stock: renderStock, treso: renderTreso, expo: renderExpo, photos: renderPhotos, settings: renderSettings })[tab]();
}
// round 23 : mise à jour automatique de la fiche (« que ça se mette à jour côté app ») : au retour au premier plan après 1 min, et toutes les
// 2 min tant que l'app est ouverte ; jamais pendant une saisie (feuille ouverte, champ actif) ni sur Réglages ; une coupure réseau est muette (la
// dernière fiche reste affichée) ; un accès refusé donne l'écran Accès refusé, comme ↻
async function rafraichirSilencieux() {
  if (DEMO || !account || !data || chargement || document.hidden || document.querySelector(".sheet-bg")) return false;
  const a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  chargement = true;
  try { await flush(true).catch(() => {}); await load(); if (data && !document.querySelector(".sheet-bg") && tab !== "settings") render(); else header(); return true; }
  catch (e) { console.warn(e); if (e && e.acces) echec(e, false); return false; }
  finally { chargement = false; }
}
const authMsg = a => a ? t("authErr").replace("{0}", (a.errorMessage || a.message || String(a)).split("\n")[0]) : "";
const authText = () => authMsg(authFailed);
async function boot() {
  sansFiche = null; header();
  try {
    migrer();
    if (!DEMO) {
      const ok = await initAuth();
      if (ok && !account && comptes.length > 1) { choixCompte(); return; }
      if (!ok || !account) {
        data = null; place = null; pending = {}; refus = {}; header();
        $("#nav").innerHTML = "";
        $("#main").innerHTML = '<div class="center"><div class="big" style="margin-bottom:10px">Atlas</div><p class="muted">' + t("loginTxt") + '</p>' + (authFailed ? '<p class="refused">' + esc(authText()) + '</p>' : "") +
          (ok ? '<button class="btn" id="login">' + t("login") + '</button>' : "") + '<label>' + t("clientId") + '</label><input id="cid" autocapitalize="off" autocorrect="off" value="' + esc(ls.get("clientId", CONFIG.clientId)) + '"><button class="btn light" id="saveCid">' + t("save") + '</button></div>';
        if ($("#login")) $("#login").onclick = () => pca.loginRedirect({ scopes: SCOPES });
        $("#saveCid").onclick = () => { ls.set("clientId", $("#cid").value.trim()); location.reload(); };
        return;
      }
      ouvrir(); if (data) render();   // affichage immédiat de la dernière fiche connue de CE compte et de CE dossier
      if (authFailed) toast(authText() + " · " + t("retry"));
      await flush(true).catch(e => console.warn(e));      // modifications gardées sur le téléphone pour CE compte : renvoyées d'abord
    } else ouvrir();
    await load(); render();
  } catch (e) { echec(e, true); }
}
// erreur au démarrage (boot) ou sur ↻
function echec(e, auBoot) {
  console.error(e);
  // jeton refusé après un retour en erreur de Microsoft (garde-fou anti-boucle) : le motif et la façon de réessayer, jamais le message MSAL brut ;
  // une coupure réseau ou une erreur Graph garde son propre message (elles n'ont pas d'errorCode MSAL) (revue 3, défaut 12)
  const auth = !!(authFailed && pca && e && e.errorCode), af = auth ? authFailed : null;
  // motif composé à chaque dessin (langue) : seuls l'erreur et le refus de connexion sont gardés (e.texte : fonction ; e.cle : clé du texte)
  const motif = () => e && e.texte ? e.texte() : auth ? authMsg(af) + " · " + t("retry") : "⚠ " + (e && e.cle ? t(e.cle) : e && e.message), msg = motif();
  // accès refusé (403, ou 404 du dossier) : la fiche est déjà retirée ; une feuille restée ouverte sur elle est fermée ; si son envoi n'avait
  // pas commencé (bouton Enregistrer actif), rien n'est envoyé et c'est dit ; un envoi en cours (bouton désactivé) donnera son propre message
  // (gardée, bloquée ou envoyée) ; écran Accès refusé
  if (e && e.acces) {
    const f = Array.from(document.querySelectorAll(".sheet-bg")), saisie = f.some(x => { const o = x.querySelector("#ok"); return !!o && !o.disabled; }); f.forEach(x => x.remove());
    accesRefuse(msg); toast(saisie ? msg + " · " + t("sheetClosed") : msg); return;
  }
  if (data || !auBoot) { toast(msg); return; }
  ecranErreur(motif, auth);
}
// écrans sans fiche, redessinés par render() (abandon, Réessayer, langue) ; ils gardent les sorties du compte : entrées bloquées (Réessayer,
// Copier, Abandonner) et Se déconnecter
// accès refusé : le motif, le compte, « Changer de dossier »
function accesRefuse(msg) {
  sansFiche = () => accesRefuse(msg); $("#nav").innerHTML = ""; header();
  const box = us.get("outbox", []);
  $("#main").innerHTML = '<div class="center"><p class="refused">' + esc(msg) + '</p><p class="muted">' + esc(t("denied").replace("{0}", (account && account.username) || "")) + '</p>' +
    '<button class="btn light" id="resetPlace">' + t("reset") + '</button>' + htmlBloquees(box) + htmlCompte(box, false, true) + '</div>';
  $("#resetPlace").onclick = changerDossier; lierSorties();
}
// erreur au démarrage sans fiche : le motif (connexion refusée : le bouton de connexion) ; motif : fonction, recomposée à chaque dessin (langue)
function ecranErreur(motif, auth) {
  sansFiche = () => ecranErreur(motif, auth); $("#nav").innerHTML = "";
  const box = us.get("outbox", []), msg = motif();
  $("#main").innerHTML = (auth ? '<div class="center"><p class="refused">' + esc(msg) + '</p><button class="btn" id="relogin2">' + t("login") + '</button>'
                               : '<div class="center"><p class="muted">' + esc(msg) + '</p>') + htmlBloquees(box) + htmlCompte(box, false, true) + '</div>';
  if (auth) $("#relogin2").onclick = () => { authFailed = null; pca.acquireTokenRedirect({ scopes: SCOPES, account }).catch(er => { authFailed = er; toast(authText()); }); };
  lierSorties();
}
$("#btnLang").onclick = () => { lang = lang === "fr" ? "en" : "fr"; ls.set("lang", lang); render(); header(); };
// ↻ : action volontaire, elle peut relancer la connexion Microsoft (authFailed remis à nul) ; si la personne annule de nouveau, initAuth le repose ;
// sans compte actif (connexion, choix du compte, retour arrière après déconnexion) : le démarrage
$("#btnRefresh").onclick = async () => {
  if (!DEMO && !account) return boot();
  authFailed = null; try { await flush().catch(e => console.warn(e)); await load(); render(); } catch (e) { echec(e, false); } };
window.addEventListener("online", () => { flush(true).catch(() => {}).then(() => { if (data && tab === "photos" && !document.querySelector(".sheet-bg")) render(); }); });
// retour au premier plan un autre jour : date du jour, retards et calendrier recalculés (seulement si le jour a changé : une saisie en cours
// dans Réglages n'est pas effacée) ; round 23 : et la fiche relue si la dernière lecture date de plus d'une minute
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !data) return;
  const old = today, now = todayIso();
  if (now !== old) {
    if (calMonth && iso(calMonth).slice(0, 7) === old.slice(0, 7)) calMonth = null;   // suit le mois courant si l'utilisateur n'avait pas navigué
    const d = document.querySelector(".sheet input#d[type=date]"); if (d && d.value === old && !document.querySelector(".sheet #seg")) d.value = now;   // feuille de comptage restée ouverte
    if (tab !== "settings" && !document.querySelector(".sheet-bg")) render(); else today = now;
  }
  if (Date.now() - derniereLecture > 60000) rafraichirSilencieux();
});
if (!window.ATLAS_ESSAI) setInterval(() => { if (!document.hidden && Date.now() - derniereLecture > 120000) rafraichirSilencieux(); }, 30000);
window.addEventListener("pageshow", e => { if (!e.persisted) return; if (!DEMO && !account) boot(); else document.dispatchEvent(new Event("visibilitychange")); });
// page d'essai : l'app est chargée sans démarrer, les essais appellent ses fonctions
if ("serviceWorker" in navigator && !DEMO && !window.ATLAS_ESSAI) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!window.ATLAS_ESSAI) boot();
